<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ぽんぽこ温泉宿</title><meta name="description" content="たぬき女将ポン子の温泉宿で、いぬとねこをとなりにしないように泊めるパズル。全100ステージ・スマホでそのまま遊べます。"><meta property="og:type" content="website"><meta property="og:site_name" content="ぽんぽこ温泉宿"><meta property="og:title" content="ぽんぽこ温泉宿 ― となりにしたら、ケンカ！"><meta property="og:description" content="たぬき女将ポン子の温泉宿で、いぬとねこをとなりにしないように泊めるパズル。全100ステージ・スマホでそのまま遊べます。"><meta property="og:url" content="https://kinakoneko00-web.github.io/ponpoko-onsen/"><meta property="og:image" content="https://kinakoneko00-web.github.io/ponpoko-onsen/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"></head><body><title>ぽんぽこ温泉宿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Kaisei+Decol:wght@700&family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: 漆塗りの木枠で囲んだ1画面ゲーム。上に札型のHUD、中央に夕暮れの温泉街ステージ（左:いぬの待合 / 中央:旅館 / 右:ねこの待合）、下に女将の会話巻物と「大喝」ボタン。単一の世界観なので固定配色 */
:root{
  color-scheme: dark;
  --lac:#24130d; --lac-2:#3a2216; --lac-3:#4e2e1c;
  --wood:#7a4a2a; --wood-l:#a8703f;
  --gold:#e8b84a; --gold-l:#ffe08a; --gold-d:#8a5a12;
  --paper:#fbf3e0; --paper-2:#efe0bf;
  --ink:#2a1a12; --muted:#8a7058; --ol:#3a2216;
  --ver:#d8432e; --ver-d:#8f2618;
  --dog:#e2672b; --dog-d:#9c3d12;
  --cat:#4256b0; --cat-d:#24316e;
  --ok:#5fb85a; --alarm:#e5393e;
  --f-display:"Dela Gothic One","M PLUS Rounded 1c","Hiragino Sans",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --stroke:2px 0 0 var(--ol),-2px 0 0 var(--ol),0 2px 0 var(--ol),0 -2px 0 var(--ol),1.5px 1.5px 0 var(--ol),-1.5px 1.5px 0 var(--ol),1.5px -1.5px 0 var(--ol),-1.5px -1.5px 0 var(--ol);
}
html,body{height:100%;margin:0}
body{color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow-x:hidden;-webkit-user-select:none;user-select:none;
  background:radial-gradient(ellipse at 50% 0%,#4a2a1a,transparent 70%),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 11px),var(--lac)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold-l);outline-offset:2px}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.game{max-width:480px;margin:0 auto;padding-block:8px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px}

/* ---------- HUD ---------- */
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px}
.meter{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;min-width:0;
  padding:6px 12px 8px 8px;border-radius:12px;background:linear-gradient(180deg,var(--lac-3),var(--lac-2));
  box-shadow:inset 0 0 0 2px var(--gold-d),inset 0 0 0 3px #00000055,0 3px 0 #120905}
.meter .ico{grid-row:1/3;width:38px;height:38px;filter:drop-shadow(0 2px 0 #0008)}
.meter .lbl{font-size:11px;font-weight:700;color:var(--paper-2);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter .val{font-family:var(--f-display);font-size:clamp(17px,3vw,25px);line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:var(--stroke),0 3px 0 var(--ol)}
.meter .val small{font-size:.5em;color:var(--paper-2);text-shadow:none;margin-left:3px}
.meter .bar{grid-column:1/-1;height:8px;margin-top:5px;border-radius:5px;background:#00000066;box-shadow:inset 0 1px 0 #000a;position:relative;overflow:hidden}
.meter .bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;box-shadow:inset 0 2px 0 #ffffff55}
.m-time .val{color:#fff}
.m-time .bar i{background:linear-gradient(90deg,#6fb3e0,#a8dcff)}
.m-time.low .val{color:#ff8a8a;animation:beat .5s ease-in-out infinite alternate}
.m-time.low .bar i{background:var(--alarm)}
.m-cr .val{color:var(--gold-l)}
.m-cr .bar i{background:linear-gradient(90deg,#c88a1a,var(--gold-l))}
.m-cr.done .bar i{background:linear-gradient(90deg,#3f9a3b,#9be68f)}
.m-sus .val{color:#ff9c9c}
.m-sus .bar i{background:repeating-linear-gradient(135deg,var(--alarm) 0 6px,#ff7b7f 6px 12px)}
.m-sus.hot{animation:hot .45s ease-in-out infinite alternate}
@keyframes hot{to{box-shadow:inset 0 0 0 2px var(--alarm),inset 0 0 18px #e5393e88,0 3px 0 #120905}}
@keyframes beat{to{transform:scale(1.08)}}
.icons{display:flex;flex-direction:column;gap:6px}
.ibtn{width:40px;height:30px;display:grid;place-items:center;border:0;border-radius:9px;background:linear-gradient(180deg,var(--lac-3),var(--lac-2));box-shadow:inset 0 0 0 2px var(--gold-d),0 2px 0 #120905}
.ibtn svg{width:18px;height:18px}
.ibtn:hover{box-shadow:inset 0 0 0 2px var(--gold),0 2px 0 #120905}

/* ---------- ステージ ---------- */
.frame{padding:7px;border-radius:18px;background:linear-gradient(180deg,#6b3f22,#3e2212);box-shadow:inset 0 0 0 2px var(--gold-d),0 6px 0 #120905,0 10px 30px #0008}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 215px);min-height:380px;overflow:hidden;border-radius:12px;background:#f3c99a;box-shadow:inset 0 0 0 2px #00000066}
.stage.shake{animation:shake .3s}
@keyframes shake{25%{translate:-6px 2px}50%{translate:5px -2px}75%{translate:-3px 1px}}
.stage canvas,.stage svg.inn{position:absolute;inset:0;width:100%;height:100%}
.stage svg.inn{overflow:visible;z-index:2}
#particles{z-index:2}
.gd{display:flex;flex-direction:column;line-height:1.15;gap:1px}
.gd b{font-size:12px}
.gd .nq{font-size:12px;font-weight:800;color:#fff}
.gd .nq.ok{color:#c8ffb8}
.gd .lf{font-size:10px;letter-spacing:1px;color:#ffd0c8}
.gd .lf i{font-style:normal;color:#ffffff55}
.lane-tag.warn{animation:blink .4s ease-in-out infinite alternate;box-shadow:inset 0 0 0 2px var(--alarm),0 3px 0 #0006}
.lane-tag{position:absolute;top:10px;z-index:2;display:flex;align-items:center;gap:6px;padding:3px 12px 3px 4px;border-radius:10px;
  font-weight:800;font-size:13px;color:#fff;box-shadow:inset 0 0 0 2px #ffffff40,0 3px 0 #0006;text-shadow:0 1px 0 #0006}
.lane-tag svg{width:28px;height:28px;background:var(--paper);border-radius:50%;box-shadow:0 0 0 2px var(--ol)}
.lane-tag.A{left:10px;background:linear-gradient(180deg,var(--dog),var(--dog-d))}
.lane-tag.B{right:10px;background:linear-gradient(180deg,#5a6fd0,var(--cat-d))}

.inn .halo{fill:none;stroke:transparent;stroke-width:7}
.mix .inn .halo{stroke:var(--alarm);animation:blink .45s ease-in-out infinite alternate}
.solo .inn .halo{stroke:var(--gold-l);filter:drop-shadow(0 0 10px #ffe08a)}
.inn .shoji{stroke:#1e0f07;stroke-width:2}
.inn .fightr{animation:blink .45s ease-in-out infinite alternate}
.inn .chainr{filter:drop-shadow(0 0 6px #ffe08a)}
@keyframes blink{to{opacity:.25}}

/* ===== 第7版：ごほうび帳・着物・クリア演出 ===== */
svg .kimono{fill:var(--kimono,#6a4c8c)} svg .hana{fill:var(--hana,#e5393e)}
.modes .modeb2.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
.ach{width:100%;display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto;padding:2px}
.achc{color:var(--ink);display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;background:var(--cream);box-shadow:0 0 0 2px var(--navy);text-align:left}
.achc .md{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:#e7dcc6;color:#9a8e78;box-shadow:inset 0 0 0 2px #b9ab90}
.achc.got .md{background:radial-gradient(circle at 35% 30%,#fff3b0,#e9b33a 60%,#b07a12);color:#5a3a06;box-shadow:inset 0 0 0 2px #7a4a12}
.achc b{color:var(--ink);display:block;font-family:var(--f-wa);font-size:13.5px}.achc small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.achc .rw{display:block;font-size:11px;font-weight:800;color:var(--pop-o)}
.achc:not(.got){opacity:.78}
.kimonos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.kim{position:relative;padding:4px 2px 6px;border:0;border-radius:10px;background:var(--cream);box-shadow:0 0 0 2px var(--navy);font-weight:800;font-size:12px;color:var(--ink)}
.kim svg{width:56px;height:56px;display:block;margin:0 auto}
.kim.on{box-shadow:0 0 0 3px var(--pop-o),0 0 0 5px var(--navy)}
.kim:disabled{opacity:1}.kim:disabled svg{filter:grayscale(1) brightness(.6)}.kim:disabled::after{content:'？';position:absolute;inset:4px 0 auto;font-size:26px;color:#fff;text-shadow:0 0 0 #000,0 2px 0 #1d1630}
.rline{display:flex;align-items:flex-end;gap:8px;width:100%;margin:6px 0 2px}
.rline .rf{flex:none;width:52px;height:52px;border-radius:50%;background:#f6ead0;box-shadow:0 0 0 2px var(--navy);overflow:hidden}
.rline .rf svg{width:100%;height:100%}
.rline p{position:relative;flex:1;margin:0;padding:8px 11px;border-radius:12px;background:#fff;box-shadow:0 0 0 2px var(--navy);font-size:13px;font-weight:700;line-height:1.5;text-align:left;animation:rlin .45s .9s both}
.rline p::before{content:'';position:absolute;left:-7px;bottom:12px;border:6px solid transparent;border-right-color:var(--navy);border-left:0}
.rline p small{display:block;font-size:10.5px;color:var(--muted)}
.rline.bad svg .worry{display:inline}.rline.bad svg .happy{display:none}
@keyframes rlin{from{opacity:0;transform:translateY(6px) scale(.96)}}
.chapclear{position:relative;margin:4px auto 2px;padding:6px 18px;border-radius:8px;background:linear-gradient(#fff3c8,#ffd76a);box-shadow:0 0 0 2.5px #7a4a12,0 3px 0 2.5px #7a4a12;font-family:var(--f-wa);font-size:15px;color:#5a3006;animation:stampin .5s 1.25s both}
.chapclear small{display:block;font-family:inherit;font-size:11px;color:#8a5a16}
@keyframes stampin{0%{opacity:0;transform:scale(2.2) rotate(-8deg)}70%{opacity:1;transform:scale(.94) rotate(1deg)}100%{transform:none}}
.achh{margin:8px 0 4px;font-family:var(--f-wa);font-size:13px;color:#f3e3b8;letter-spacing:.05em}
.achnew{color:var(--ink);width:100%;margin:6px 0 0;padding:7px 10px;border-radius:10px;background:#fff7dc;box-shadow:0 0 0 2px #e9b33a;font-size:12.5px;font-weight:800;text-align:left;animation:rlin .45s 1.5s both}
.achnew b{color:#b06a00}
svg .furin{transform-box:fill-box;transform-origin:50% 0;animation:furin 2.6s ease-in-out infinite alternate}
@keyframes furin{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

svg .kwarn{animation:blink .5s steps(2) infinite alternate}
.guest.melt{animation:melt .38s ease-in-out infinite alternate}
@keyframes melt{from{filter:drop-shadow(0 0 0 #fff6c8) brightness(1)}to{filter:drop-shadow(0 0 7px #fff6c8) brightness(1.25);opacity:.7}}

/* お客 */
.guest{position:absolute;left:0;top:0;padding:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;z-index:3;touch-action:none;cursor:grab;
  transition:transform .6s cubic-bezier(.3,.85,.3,1),opacity .5s;will-change:transform}
.noanim .guest{transition:none}
.guest .art{display:block;width:100%;aspect-ratio:1;overflow:visible;filter:drop-shadow(0 2px 0 #0003)}
.guest.queued .art{animation:idle 1.4s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-2px) scaleY(1.02)}}
.guest .angerm{display:none}
.guest.hurry .angerm{display:inline;animation:anger .35s ease-in-out infinite alternate;transform-origin:31px 1px}
@keyframes anger{to{transform:scale(1.25)}}
.guest.hurry .art{animation:fidget .22s ease-in-out infinite alternate}
@keyframes fidget{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.guest.queued:hover .art{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 2px 0 #0003)}
.guest.full{opacity:.55}
.guest.nope{animation:nope .3s}
@keyframes nope{25%{translate:-7px 0}75%{translate:7px 0}}
.ptag{display:flex;flex-direction:column;gap:2px;min-width:46px;padding:2px 4px 3px;border-radius:8px;background:var(--paper);color:var(--ink);box-shadow:0 0 0 2px var(--ol),0 3px 0 #0005}
.ptag .pr{display:flex;align-items:center;justify-content:center;gap:3px;font-family:var(--f-display);font-size:12px;line-height:1.1}
.ptag .pr svg{width:12px;height:12px}
.guest.vip .ptag{background:linear-gradient(180deg,#fff6c8,#ffe08a)}
.pbar{display:block;height:5px;border-radius:3px;background:#00000026;position:relative;overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--ok)}
.guest.hurry .pbar i{background:var(--alarm)}
.guest.docked{pointer-events:auto;cursor:pointer}
.guest.docked .pbar{width:70%;height:6px;background:#00000055;box-shadow:0 0 0 1.5px var(--ol)}
.guest.docked .pbar i{background:linear-gradient(90deg,#c88a1a,var(--gold-l))}
.guest.kickable .art{animation:kick .4s ease-in-out infinite alternate}
@keyframes kick{to{filter:drop-shadow(0 0 6px var(--alarm)) drop-shadow(0 0 2px var(--alarm))}}

/* 時間帯の空気感 */
.stage::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:multiply;opacity:0;transition:opacity .4s}
.stage.th-yoru::before{opacity:1;background:radial-gradient(ellipse at 50% 40%,rgba(120,140,220,.25),rgba(30,40,110,.42))}
.stage.th-yu::before{opacity:1;background:linear-gradient(180deg,rgba(255,170,110,.12),rgba(200,90,60,.12))}
.stage.th-asa::before{opacity:1;background:linear-gradient(180deg,rgba(255,200,215,.12),rgba(255,236,200,.06))}
/* ストーリー */
.vn{width:100%;max-width:440px;min-height:min(640px,88vh);display:flex;flex-direction:column;justify-content:flex-end;gap:10px;cursor:pointer;position:relative}
.vn-title{position:absolute;top:0;left:50%;transform:translateX(-50%);margin:0;white-space:nowrap;font-family:var(--f-display);font-size:18px;color:#fff;
  padding:4px 22px;background:var(--lac-2);border-radius:999px;box-shadow:inset 0 0 0 2px var(--gold-d);animation:evin .4s both}
.vn-stage{position:relative;height:min(300px,44vh)}
.vn-ch{position:absolute;bottom:0;width:58%;max-width:250px;aspect-ratio:1;filter:brightness(.55) saturate(.7);transition:filter .2s,transform .2s;transform:scale(.94)}
.vn-ch svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 0 #0004)}
.vn-ch.l{left:-4%} .vn-ch.r{right:-4%}
.vn-ch .worry{display:none}
.vn-ch.on{filter:none;transform:scale(1);z-index:1;animation:talk .3s ease-out}
@keyframes talk{0%{transform:translateY(6px) scale(.98)}100%{transform:none}}
.vn-box{position:relative;text-align:left;color:var(--ink);padding:18px 16px 22px;border-radius:14px;min-height:118px;
  background:linear-gradient(180deg,var(--paper),var(--paper-2));box-shadow:inset 0 0 0 2px var(--gold-d),inset 0 0 0 5px var(--paper),inset 0 0 0 6px #c9a46a,0 6px 0 #0006}
.vn-name{position:absolute;top:-13px;left:14px;font-weight:800;font-size:13px;color:#fff;background:var(--ver);padding:2px 12px;border-radius:6px;box-shadow:0 2px 0 #0005}
.vn-text{margin:0;font-weight:700;font-size:16px;line-height:1.7}
.vn-text.nar{text-align:center;color:var(--muted)}
.vn-next{position:absolute;right:14px;bottom:6px;color:var(--ver);font-size:12px;animation:blink .5s ease-in-out infinite alternate}
.vn-skip{position:absolute;top:44px;right:0;border:0;border-radius:999px;padding:4px 14px;font-weight:800;font-size:12px;color:#fff;background:#0006;box-shadow:inset 0 0 0 1.5px #fff6}
.storyrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;color:#fff;font-weight:800;font-size:12px}
.schip{border:0;border-radius:999px;padding:3px 12px;font-weight:800;font-size:12px;color:var(--ink);background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--gold-d)}

/* 演出 */
.rflash{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(ellipse at center,rgba(229,57,62,0) 30%,rgba(229,57,62,.55));animation:rf .2s ease-out forwards}
@keyframes rf{from{opacity:1}to{opacity:0}}
.guest.land .art{animation:land .42s cubic-bezier(.3,1.6,.5,1)!important;transform-origin:50% 95%}
@keyframes land{0%{transform:scale(1.18,.78)}45%{transform:scale(.94,1.1)}100%{transform:scale(1,1)}}
.pt{position:absolute;pointer-events:none;z-index:6;animation:pt .7s ease-out forwards}
.pt.dust{width:10px;height:10px;margin:-5px;border-radius:50%;background:rgba(255,248,230,.9)}
.pt.spark{width:12px;height:12px;margin:-6px;background:#ffe08a;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 3px #fff)}
@keyframes pt{0%{transform:translate(0,0) scale(.4);opacity:1}60%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
.coinfly{position:fixed;z-index:60;width:18px;height:22px;margin:-11px 0 0 -9px;pointer-events:none;border-radius:50%;
  background:radial-gradient(ellipse at 35% 30%,#fff3c4,#f2c14e 45%,#b07a17);box-shadow:inset 0 0 0 2px #8a5a12;transition:transform .55s cubic-bezier(.45,-.45,.7,1)}
.meter.bump{animation:bump .22s ease-out}
@keyframes bump{50%{transform:scale(1.06)}}
.conf{position:fixed;top:-12px;z-index:40;width:10px;height:15px;border-radius:2px;pointer-events:none;animation:conf 2s ease-in forwards}
@keyframes conf{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
.go:active,.tool-btn:active,.sp:active,.ibtn:active,.tile:active,.upc:active,.modeb:active,.kickbtn:active,.req:active{transform:scale(.92)!important;transition:transform .08s}
.m-cr .bar i,.m-sus .bar i,.m-time .bar i{transition:width .3s ease-out}

/* 化け術 */
.pop.doron{color:#fff;font-size:24px;text-shadow:0 0 0 #fff,2px 0 0 #2e5a1a,-2px 0 0 #2e5a1a,0 2px 0 #2e5a1a,0 -2px 0 #2e5a1a,0 4px 0 #2e5a1a}
.smoke{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle,#fff,#ffffffcc 45%,#ffffff00 70%);pointer-events:none;z-index:6;animation:smoke .7s ease-out forwards}
@keyframes smoke{from{transform:scale(.3);opacity:1}to{transform:scale(2.2) translateY(-10px);opacity:0}}
.stage.bmode .guest.queued,.stage.bmode .guest.docked{cursor:pointer}
.stage.bmode .guest:not(.U) .art{filter:drop-shadow(0 0 5px #b8ff7a) drop-shadow(0 2px 0 #0003)}
/* お題・作戦カード */
.tk{min-width:0;flex:1}
.tkh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-bottom:2px}
.mis{font-size:11px;font-weight:800;color:var(--ink);background:#fff6c8;border-radius:6px;padding:0 8px;box-shadow:inset 0 0 0 1.5px #c9a46a}
.mis b{margin-left:6px;color:#8a5a12}
.mis.ok{background:#d8f5cf;box-shadow:inset 0 0 0 1.5px #5fb85a} .mis.ok b{color:#2e7a2e}
.mis.ng{background:#f3dcd8;box-shadow:inset 0 0 0 1.5px #c0392b} .mis.ng b{color:#c0392b}
.conds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;text-align:left;font-weight:700;font-size:14px}
.conds li{display:flex;gap:8px;align-items:baseline}
.conds .ok{color:#2e8a3a} .conds .ng{color:#c0392b}
.conds .si{color:#d89a10}
.mini{width:min(220px,70%);height:auto}

  --f-body:"Zen Maru Gothic","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif}
body{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2740%27%20height%3D%2720%27%20viewBox%3D%270%200%2040%2020%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23ffffff%27%20stroke-opacity%3D%27.07%27%20stroke-width%3D%271.4%27%3E%3Cpath%20d%3D%27M0%2020a20%2020%200%200%201%2040%200M6%2020a14%2014%200%200%201%2028%200M12%2020a8%208%200%200%201%2016%200M-20%2010a20%2020%200%200%201%2040%200M-14%2010a14%2014%200%200%201%2028%200M-8%2010a8%208%200%200%201%2016%200M20%2010a20%2020%200%200%201%2040%200M26%2010a14%2014%200%200%201%2028%200M32%2010a8%208%200%200%201%2016%200%27/%3E%3C/g%3E%3C/svg%3E") 0 0/40px 20px,var(--navy)}
.screen{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2740%27%20height%3D%2720%27%20viewBox%3D%270%200%2040%2020%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23ffffff%27%20stroke-opacity%3D%27.08%27%20stroke-width%3D%271.4%27%3E%3Cpath%20d%3D%27M0%2020a20%2020%200%200%201%2040%200M6%2020a14%2014%200%200%201%2028%200M12%2020a8%208%200%200%201%2016%200M-20%2010a20%2020%200%200%201%2040%200M-14%2010a14%2014%200%200%201%2028%200M-8%2010a8%208%200%200%201%2016%200M20%2010a20%2020%200%200%201%2040%200M26%2010a14%2014%200%200%201%2028%200M32%2010a8%208%200%200%201%2016%200%27/%3E%3C/g%3E%3C/svg%3E") 0 0/40px 20px,radial-gradient(circle at 0% 100%,#cf4a2a55,transparent 45%),radial-gradient(circle at 100% 0%,#2e4f9488,transparent 50%),var(--navy)}
.screen:has(.ttl){background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2740%27%20height%3D%2720%27%20viewBox%3D%270%200%2040%2020%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23ffffff%27%20stroke-opacity%3D%27.16%27%20stroke-width%3D%271.4%27%3E%3Cpath%20d%3D%27M0%2020a20%2020%200%200%201%2040%200M6%2020a14%2014%200%200%201%2028%200M12%2020a8%208%200%200%201%2016%200M-20%2010a20%2020%200%200%201%2040%200M-14%2010a14%2014%200%200%201%2028%200M-8%2010a8%208%200%200%201%2016%200M20%2010a20%2020%200%200%201%2040%200M26%2010a14%2014%200%200%201%2028%200M32%2010a8%208%200%200%201%2016%200%27/%3E%3C/g%3E%3C/svg%3E") 0 0/40px 20px,linear-gradient(112deg,#e07a3a 0,#c9532a 49.4%,#f8f2e2 49.4%,#f8f2e2 50.6%,#3a5ea8 50.6%,#1f3a73 100%)}
/* 和紙のカード：生成り＋細い二重線 */
.scroll,.talk,.vn-box{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2724%27%20height%3D%2742%27%20viewBox%3D%270%200%2024%2042%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%237b6f5c%27%20stroke-opacity%3D%27.10%27%20stroke-width%3D%271%27%3E%3Cpath%20d%3D%27M12%200v14M12%2028v14M0%207l12%207%2012-7M0%2035l12-7%2012%207M0%207v28M24%207v28M12%2014l-12%2021M12%2014l12%2021M12%2028l-12-21M12%2028l12-21%27/%3E%3C/g%3E%3C/svg%3E") 0 0/24px 42px,var(--cream)!important}
.scroll{border-radius:10px;box-shadow:inset 0 0 0 5px var(--cream),inset 0 0 0 6.5px #c9a46a,0 0 0 3px var(--navy),0 7px 0 3px #0008}
.talk{border-radius:12px;box-shadow:inset 0 0 0 4px var(--cream),inset 0 0 0 5px #c9a46a,0 0 0 3px var(--navy),0 4px 0 3px var(--navy)}
.vn-box{border-radius:12px!important;box-shadow:inset 0 0 0 5px var(--cream),inset 0 0 0 6.5px #c9a46a,0 0 0 3px var(--navy),0 6px 0 3px #0008!important}
.meter{background:var(--cream);border-radius:10px;box-shadow:0 0 0 3px var(--navy),0 4px 0 3px var(--navy)}
.ibtn,.tool-btn{background:var(--cream)!important;border-radius:10px}
.tool-btn.on,.leaf.on{background:var(--pop-y)!important}
.tile{border-radius:8px}
.tile.th-hiru,.tile.th-yu,.tile.th-asa{background:var(--cream)}
.tile.th-yoru{background:#2b3658}
.gchip{border-radius:10px;background:#fffaf0} .gchip.A{background:#fbe3d2} .gchip.B{background:#dde4f4}
.gl-x{background:#efe6d0;border-radius:8px}
.gstar{background:var(--navy);color:var(--pop-y)}
/* 見出しは和の書体 */
.rtitle,.scroll h2,.h3,.vn-title,.ttl-copy,.gl-h b,.mapbar,.sc>.rtitle{font-family:var(--f-wa)!important;font-weight:700!important}
.rtitle,.scroll h2{letter-spacing:.06em}
.talk .name,.vn-name{font-family:var(--f-wa);letter-spacing:.1em}
/* 判子のようなボタン：朱色、角はやや四角 */
.go{border-radius:12px;background:var(--pop-o);font-family:var(--f-wa);font-weight:700;letter-spacing:.12em;box-shadow:inset 0 0 0 3px #ffffff33,0 0 0 3px var(--navy),0 6px 0 3px var(--navy)}
.go:active{box-shadow:inset 0 0 0 3px #ffffff33,0 0 0 3px var(--navy),0 2px 0 3px var(--navy)}
.go.sub{background:var(--cream);color:var(--ink);letter-spacing:.06em}
.go{white-space:nowrap;max-width:100%}
@media (max-width:400px){.go{font-size:clamp(18px,6.4vw,26px);letter-spacing:.06em;padding-inline:22px}}
.go.ttl-go{border-radius:12px;background:var(--pop-o);color:#fff;font-family:var(--f-wa);letter-spacing:.2em;box-shadow:inset 0 0 0 3px #ffffff40,0 0 0 4px var(--navy),0 8px 0 4px var(--navy)}
.go.ttl-go span{color:var(--pop-y)}
.ttl-pill{background:var(--navy);color:var(--pop-y);font-family:var(--f-wa);border-radius:6px}
.ttl-copy{background:var(--cream);border-radius:8px;box-shadow:inset 0 0 0 3px var(--cream),inset 0 0 0 4.5px #c9a46a,0 5px 0 var(--navy)}
.ttl-copy b{color:var(--pop-o)}
.ttl-logo span:last-child{color:var(--pop-y)}
.lane-tag{border-radius:8px}
.lane-tag.A{background:var(--dog)} .lane-tag.B{background:var(--cat)}
.mis{border-radius:6px!important}
.talk .name,.vn-name{border-radius:5px!important}
.thn{border-radius:5px}
.hanko{font-family:var(--f-wa)}
.vn-title{background:var(--cream)!important;border-radius:6px}
.ptag .pr{white-space:nowrap;font-size:11px}
.modeb.on{background:#4f8a3a}

/* 設定 */
.dlg{position:fixed;inset:0;z-index:45;display:grid;place-items:center;padding:16px;background:#0d1222b3;backdrop-filter:blur(2px)}
.dlg-card{width:min(420px,100%);max-height:calc(100dvh - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px;align-items:stretch;padding:20px 18px 18px;color:var(--ink);text-align:left;
  background:var(--cream);border-radius:12px;box-shadow:inset 0 0 0 5px var(--cream),inset 0 0 0 6.5px #c9a46a,0 0 0 3px var(--navy),0 8px 0 3px #0008;animation:evin .25s both}
@keyframes dlgin{from{transform:scale(.9);opacity:0}}
.dlg-card{animation:dlgin .22s cubic-bezier(.3,1.5,.5,1) both}
.dlg-card .rtitle{text-align:center}
.dlg-card .go{align-self:center;min-width:200px;margin-top:4px}
.dlg-card .rart{align-self:center}
.sgrp{display:flex;flex-direction:column;gap:2px;background:#fffaf0;border-radius:10px;padding:6px 12px;box-shadow:0 0 0 2px #e4d6b8}
.sh{margin:2px 0 2px;font-family:var(--f-wa);font-weight:700;font-size:12px;color:var(--muted);letter-spacing:.1em}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;border-top:1px dashed #e4d6b8}
.sh+.srow{border-top:0}
.srow b{display:block;font-size:14.5px}
.srow small{display:block;font-size:11px;font-weight:700;color:var(--muted);line-height:1.35}
.sw{flex:none;position:relative;width:76px;height:32px;border:0;border-radius:999px;background:#d8cfbd;box-shadow:inset 0 0 0 2px var(--navy);font-weight:900;font-size:12px;color:var(--ink);padding:0 10px 0 34px;text-align:center;transition:background .15s}
.sw i{position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--navy);transition:left .15s}
.sw.on{background:var(--pop-o);color:#fff;padding:0 34px 0 10px}
.sw.on i{left:48px}
.sl{display:flex;align-items:center;gap:8px;flex:1;max-width:210px}
.sl input{flex:1;accent-color:var(--pop-o);height:28px}
.sl output{width:30px;text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.srowbtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:46px;border:0;background:none;padding:0;font-weight:800;font-size:14.5px;color:var(--ink);text-align:left;border-top:1px dashed #e4d6b8}
.sh+.srowbtn,.rlist .srowbtn:first-child{border-top:0}
.srowbtn span{font-size:22px;color:var(--muted)}
.srowbtn:disabled{color:#b3a890}
.srowbtn.danger{color:#b8321e}
.srowbtn.danger.arm{color:#fff;background:#cf4a2a;border-radius:8px;padding:0 10px}
.rlist{display:flex;flex-direction:column;background:#fffaf0;border-radius:10px;padding:2px 12px;box-shadow:0 0 0 2px #e4d6b8}
.cfgbtn{border:0;border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px;background:#ffffff1f;color:#fff;box-shadow:0 0 0 2px #ffffff55}
.ttl-cfg{margin-top:2px;background:#1e2740cc;box-shadow:0 0 0 2px #ffffff66}
.paused{display:flex!important;flex-direction:column;gap:12px;align-items:center;justify-content:center}
.paused p{margin:0 0 6px;font-family:var(--f-wa);font-weight:700}
.paused .go{min-width:220px;font-size:20px}
.credit{margin:0;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.credit a{color:inherit}
.failwhy{width:100%;box-sizing:border-box;padding:8px 12px;border-radius:8px;background:#fde3dc;color:#9a2a14;font-weight:800;font-size:13.5px;text-align:left;box-shadow:0 0 0 2px #e8a08c}

/* 指さしガイド */
.coach{position:absolute;inset:0;z-index:20;cursor:pointer;animation:cfade .2s both}
@keyframes cfade{from{opacity:0}}
.coach .spot{position:absolute;border-radius:16px;box-shadow:0 0 0 3px #fff,0 0 0 9999px rgba(15,20,40,.62);animation:spotpulse 1s ease-in-out infinite alternate}
@keyframes spotpulse{to{box-shadow:0 0 0 6px #ffe14a,0 0 0 9999px rgba(15,20,40,.62)}}
.coach .cbub{position:absolute;left:12px;right:12px;padding:10px 14px 8px;border-radius:12px;background:var(--cream);color:var(--ink);box-shadow:0 0 0 3px var(--navy),0 5px 0 3px #0008;text-align:center}
.coach .cbub p{margin:0;font-weight:800;font-size:14.5px;line-height:1.5}
.coach .cbub b{color:var(--pop-o)}
.coach .cbub small{display:block;margin-top:4px;font-size:11px;font-weight:800;color:var(--muted);animation:blink .6s ease-in-out infinite alternate}
.coach .cbub::before{content:"";position:absolute;left:calc(var(--ax) - 12px - 9px);width:18px;height:18px;background:var(--cream);transform:rotate(45deg);box-shadow:0 0 0 3px var(--navy)}
.coach .cbub.down::before{top:-9px;clip-path:polygon(0 0,100% 0,0 100%)}
.coach .cbub.up::before{bottom:-9px;clip-path:polygon(100% 0,100% 100%,0 100%)}
.rbtn em.wi{font-style:normal;background:#2f7fd0;color:#fff;border-radius:999px;padding:0 5px;font-size:.85em;font-weight:900}

/* チュートリアル */
.tut{position:fixed;inset:0;z-index:40}
.tut.pass,.tut.pass *{pointer-events:none}
.tut.hide{opacity:0;transition:opacity .15s}
.tut .tstep{display:inline-block;margin-bottom:2px;padding:0 8px;border-radius:999px;background:var(--navy);color:var(--pop-y);font-size:11px;font-weight:900}
.tut .cbub{max-width:420px;margin:0 auto}
.tut.pass .cbub{box-shadow:0 0 0 3px var(--pop-o),0 5px 0 3px #0008}
.guest.queued.pressed .art{animation:none!important;transform:translateY(-6px) scale(1.14);filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #ffe14a) drop-shadow(0 4px 0 #0004);transition:transform .08s}
.guest.queued .ptag{min-width:0;padding:1px 3px 2px}
.guest.queued .ptag .pr{font-size:10.5px}
.guest.queued .art{transform-origin:50% 95%;scale:1.38}
.modrow{display:flex;flex-wrap:wrap;gap:5px}
.mchip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px 2px 4px;border-radius:999px;background:#efe6d0;font-size:12px;font-weight:800;color:var(--ink);box-shadow:0 0 0 1.5px #d8c9a6}
.mchip svg{width:18px;height:18px}
.hints li:has(.modrow){display:block}
.screen{overflow-x:hidden}
.scroll{overflow:hidden} /* 判子が押される瞬間の拡大で横にはみ出さない */
/* 中身が画面より高いとき、上が切れずにスクロールで全部見られるように */
.screen:not([hidden]){display:flex;flex-direction:column;align-items:center}
.screen>.sc{margin-block:auto;flex:none}
.lane-tag.warn{transform:scale(1.14);transform-origin:50% 100%;background:#c8321e!important;animation:warnshake .5s ease-in-out infinite!important;z-index:4}
@keyframes warnshake{0%,100%{rotate:0deg}25%{rotate:-3deg}75%{rotate:3deg}}
.lane-tag.warn .gd .lf{color:#fff;font-size:10px}
.m-sus.danger{background:#ffe0dc!important;animation:warnshake .4s ease-in-out infinite!important}
.m-sus.danger .val{color:#c8321e!important}
.upson{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;text-align:left;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.35;padding-top:6px;border-top:1px dashed #d8c9a6}
.upson b{grid-column:1/-1;font-size:11.5px;color:var(--ink)}
.upson em{display:block;font-style:normal;font-weight:900;color:var(--pop-o)}
.modes{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modeb2{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:7px 12px;border:0;border-radius:10px;background:var(--cream);color:var(--ink);text-align:left;box-shadow:0 0 0 2.5px var(--navy),0 3px 0 2.5px var(--navy)}
.modeb2 b{font-family:var(--f-wa);font-size:14px}
.modeb2 small{font-size:11px;font-weight:800;color:var(--pop-o)}
.modeb2:disabled{opacity:.45}
.bankline{margin:0;color:#fff;font-weight:800;text-align:center}
.bankline b{font-size:22px;color:var(--pop-y);margin:0 4px}
.bankline small{display:block;font-size:11px;opacity:.8}
.shopprev{width:min(300px,80%)} .shopprev svg{width:100%;height:auto;overflow:visible}
.shop,.dex{width:100%;display:flex;flex-direction:column;gap:8px}
.shopc{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--cream);color:var(--ink);text-align:left;box-shadow:0 0 0 2.5px var(--navy)}
.shopc svg{width:40px;height:40px}
.shopc b{display:block;font-family:var(--f-wa);font-size:14.5px}
.shopc small{font-size:11.5px;font-weight:700;color:var(--muted)}
.shopc.own{background:#e9f4df}
.buy{border:0;border-radius:8px;padding:6px 10px;font-weight:900;font-size:14px;color:#fff;background:var(--pop-o);box-shadow:0 0 0 2px var(--navy),0 3px 0 2px var(--navy)}
.buy small{font-size:10px;margin-left:2px}
.buy:disabled{background:#b9ae98;color:#f4efe3}
.owned{font-size:12px;font-weight:900;color:#3f7a3c}
.dex{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.dexc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px 5px;border-radius:10px;background:var(--cream);color:var(--ink);box-shadow:0 0 0 2px #c9a46a}
.dexc svg{width:44px;height:44px}
.dexc b{font-size:10px;line-height:1.2;text-align:center;min-height:2.4em}
.dexc small{font-size:10px;font-weight:800;color:var(--muted)}
.dexc i{position:absolute;top:4px;right:6px;font-style:normal;font-size:10px;font-weight:900;color:#fff;background:var(--navy);border-radius:4px;padding:0 3px}
.dexc.none svg{filter:brightness(0);opacity:.22}
.dexc.silver{box-shadow:0 0 0 3px #a9b4c4} .dexc.gold{box-shadow:0 0 0 3px #e9b33a,0 0 10px #ffe08a}
.earn{margin:0;font-weight:900;color:#b86e00} .earn small{font-size:11px;color:var(--muted);margin-left:4px}
.bigscore{margin:0;display:flex;align-items:baseline;gap:6px;color:var(--ink)} .bigscore b{font-family:var(--f-display);font-size:54px;color:var(--pop-o)} .bigscore small{font-weight:800}

/* ===== 第3版：見やすさ・さわりやすさ ===== */
/* 待合：段ごとの組合札 */
.lane-tag{display:grid!important;grid-template-columns:auto 1fr;grid-template-rows:auto auto;align-content:center;gap:2px 4px!important;padding:4px 5px!important;border-radius:10px!important;max-width:none!important;box-sizing:border-box;right:auto!important;text-shadow:0 1px 0 #0005}
.lane-tag svg{width:24px!important;height:24px!important;grid-row:1;grid-column:1}
.lane-tag .gd{display:contents!important}
.lane-tag .gd b{display:none!important}
.lane-tag .nq{grid-row:1;grid-column:2;display:flex!important;flex-direction:column;font-family:var(--f-display);font-size:16px!important;line-height:1;color:#fff;white-space:nowrap}
.lane-tag .nq small{font-family:var(--f-ui,inherit);font-size:9.5px;font-weight:800;opacity:.9;margin-bottom:1px}
.lane-tag .nq.ok{color:#fff6a8}
.lane-tag .lf{grid-row:2;grid-column:1/3;font-size:8.5px!important;letter-spacing:.2px!important;line-height:1.2;color:#fff;white-space:nowrap;overflow:hidden}
.lane-tag .lf em{font-style:normal;font-weight:800;font-size:9px;margin-right:2px}
.lane-tag .lf i{font-style:normal;opacity:.35}
.lane-tag.warn{transform:none!important;animation:warnshake .5s ease-in-out infinite!important}
.lane-tag.warn .gd .lf,.lane-tag.warn .lf{font-size:8.5px!important}
/* 待合のお客：席いっぱいの大きな的。絵・しるし・値札が重ならない */
.guest.queued{display:grid!important;grid-template-columns:1fr auto;grid-template-rows:1fr auto;align-items:end;justify-items:center;gap:0 2px;padding:2px 4px 4px;box-sizing:border-box;border-radius:10px}
.guest.queued .art{grid-row:1;grid-column:1;width:var(--qa,52px)!important;max-width:100%;height:auto;scale:1!important}
.guest.queued .qb{grid-row:1;grid-column:2;align-self:center;display:flex;flex-direction:column;gap:3px}
.guest.queued .qb:empty{display:none}
.guest.queued .qb svg{width:22px;height:22px;display:block;filter:drop-shadow(0 1px 0 #0005)}
.guest.queued .ptag{grid-row:2;grid-column:1/3;width:100%;box-sizing:border-box;min-width:0;padding:1px 4px 2px!important}
.guest.queued .ptag .pr{font-size:12px!important}
.guest.queued.sel{background:#fff3b0;box-shadow:0 0 0 3px #ffcf3a,0 0 14px #ffe08a}
.guest.queued.pressed{background:#fff3b0}
.guest.queued.pressed .art{transform:translateY(-4px) scale(1.08)!important}
.guest.queued.full{opacity:.6}
/* お知らせの帯は看板の上にぴったり重ねる（文字が二重に見えない） */
.banner{top:var(--signY,10px)!important;min-width:var(--signW,0);min-height:var(--signH,0);box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:2px 22px!important;max-width:calc(100% - 120px)!important}
/* 部屋の倍率：大きな数字と、その下に小さな補足 */
.rbtn span{flex-direction:column;gap:0!important;line-height:1.15;font-size:14px!important;padding:2px 9px!important;border-radius:10px!important}
.rbtn em{font-size:10px;line-height:1.1}
/* 女将のひとこと：お題は折り返して全部見せる */
.mis{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;line-height:1.35!important;padding:1px 8px!important}
.stage.slow::after,.stage.fmode::after{top:var(--signY,46px)!important;height:var(--signH,24px);min-width:var(--signW,0);box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:4px!important;background:#1e2740!important;color:#ffe08a!important;font-size:14px!important;box-shadow:0 0 0 2px #e8b84a;padding:0 14px!important}
.lane-tag{grid-template-columns:auto 1fr!important;grid-template-rows:auto auto auto}
.lane-tag .nq{grid-row:1/3!important;justify-content:center}
.lane-tag svg{grid-row:1/3!important;align-self:center}
.lane-tag .lf{grid-row:3!important;font-size:7.5px!important;letter-spacing:0!important}
.lane-tag .nq{font-size:15px!important}
.lane-tag .nq small{font-family:var(--f-body)!important;font-size:10px!important;font-weight:900!important}
.lane-tag .lf{white-space:normal!important;font-size:9px!important;line-height:1.05!important;letter-spacing:-.5px!important}
.lane-tag .lf em{font-family:var(--f-body);font-size:9.5px!important;letter-spacing:0;display:block;margin-bottom:1px}
.guest.queued .art{scale:1.12!important;transform-origin:50% 100%}
.lane-tag .lf i{opacity:1!important;color:#0000003d!important}
.guest.queued .angerm{display:none!important}
.guest.queued.hurry{background:#ffdcd6;box-shadow:0 0 0 3px #e5393e;animation:hurryq .5s ease-in-out infinite alternate}
@keyframes hurryq{to{box-shadow:0 0 0 3px #e5393e,0 0 12px #ff8a7a}}
.lane-tag .lf .dots{display:flex;flex-wrap:wrap;gap:2px}
.lane-tag .lf u{display:block;width:6px;height:6px;border-radius:50%;background:#0000003a;box-shadow:inset 0 0 0 1px #fff6}
.lane-tag .lf u.on{background:#fff;box-shadow:0 0 0 1px #c8321e}
.lane-tag.warn .lf u.on{background:#ffe14a}
.tiles{padding:10px 10px 8px 6px!important;max-height:54vh!important}
div.owned{display:none!important}
.upsd{width:100%;text-align:left;border-top:1px dashed #d8c9a6;padding-top:6px}
.upsd summary{cursor:pointer;font-size:12.5px;font-weight:900;color:var(--ink);list-style:none;padding:4px 0}
.upsd summary::-webkit-details-marker{display:none}
.upsd summary::after{content:" ▼";font-size:10px;color:var(--muted)}
.upsd[open] summary::after{content:" ▲"}
.upsd summary small{font-size:10.5px;color:var(--muted);margin-left:4px}
.upsd .upson{border-top:0;padding-top:2px}
.buy small{color:#fff;opacity:.9}
.guest.queued .qb{gap:2px!important}
.guest.queued .qb svg{width:var(--bs,20px)!important;height:var(--bs,20px)!important}
/* 女将のひとことを2段に詰め、そのぶんプレイ画面（部屋）を高く */
.talk .name{display:none!important}
.deck{height:74px;min-height:0!important;box-sizing:border-box}
.talk{height:74px;box-sizing:border-box;padding:5px 10px 5px 6px!important}
.deck .sp{width:64px!important;height:64px!important;align-self:center}
.portrait{width:44px!important;height:44px!important}
.stage{height:calc(100vh - 172px)!important;height:calc(100dvh - 172px)!important}

/* ===== タイトル：画面のどこをタップしてもスタート ===== */
.ttl{cursor:pointer}
.ttl-tap{margin-top:8px;border:0;background:none;color:#fff;font-family:var(--f-wa);font-size:24px;font-weight:700;letter-spacing:.18em;padding:12px 26px;text-shadow:0 2px 0 #1d1630,0 0 12px #0008;animation:ttlblink 1.1s ease-in-out infinite;cursor:pointer}
@keyframes ttlblink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.97)}}
.ttl.leaving{animation:ttlout .32s ease-in forwards}
.ttl.leaving .ttl-tap{animation:none;color:#ffe14a}
@keyframes ttlout{0%{filter:brightness(1)}30%{filter:brightness(1.8)}100%{filter:brightness(1);opacity:0;transform:scale(1.04)}}
/* ===== オープニングムービー ===== */
.op{position:fixed;inset:0;z-index:70;background:#000;display:grid;place-items:center;cursor:pointer;animation:opin .4s ease-out}
.op.out{animation:opout .4s ease-in forwards}
@keyframes opin{from{opacity:0}} @keyframes opout{to{opacity:0}}
.op-film{position:relative;width:min(100vw,480px);height:100%;overflow:hidden;background:#1d1630}
.op-stage{position:absolute;inset:0;overflow:hidden;animation:opfade .5s ease-out}
@keyframes opfade{from{opacity:0}}
.op-bg{position:absolute;inset:0;width:100%;height:100%}
.op-pan{animation:oppan 4.4s ease-out forwards}
@keyframes oppan{from{transform:scale(1.18) translateY(30px)}to{transform:scale(1) translateY(0)}}
.op-sun{animation:opsun 4.4s ease-out forwards} @keyframes opsun{from{transform:translateY(40px)}}
.op-mist{animation:opmist 4.4s linear forwards} @keyframes opmist{to{transform:translateX(-30px)}}
.op-steam path{animation:opsteam 2.4s ease-in-out infinite} @keyframes opsteam{0%{opacity:0;transform:translateY(10px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-20px)}}
.op-inn{animation:opzoom 4.4s ease-out forwards;transform-origin:50% 60%} @keyframes opzoom{from{transform:scale(.86)}to{transform:scale(1.04)}}
.op-leaves path{transform:translate(var(--x),-20px);animation:opleaf 3s linear infinite} @keyframes opleaf{to{transform:translate(calc(var(--x) - 60px),660px) rotate(540deg)}}
.op-crow{animation:opfade 1s 1.4s both}
.op-cap{position:absolute;left:0;right:0;bottom:9%;margin:0;padding:14px 18px;text-align:center;color:#fff;font-family:var(--f-wa);font-size:clamp(17px,5vw,22px);letter-spacing:.08em;background:linear-gradient(90deg,transparent,#000a 18%,#000a 82%,transparent);opacity:0;text-shadow:0 2px 4px #000}
.op-cap.on{animation:opcap .7s .3s ease-out forwards} @keyframes opcap{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.op-skip{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;z-index:3;border:0;border-radius:999px;padding:8px 14px;background:#ffffff26;color:#fff;font-weight:800;font-size:13px;box-shadow:inset 0 0 0 1.5px #fff6}
.op-room{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#ffe2b0,#d99a5a 70%,#8a5a36)}
.op-room.night{background:radial-gradient(circle at 50% 40%,#5a5f9a,#2b3250 70%,#1d1630)}
.op-ponko{position:absolute;left:50%;top:22%;width:min(62vw,280px);translate:-50% 0}
.op-ponko svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 0 #0003)}
.op-in{animation:opbounce .7s cubic-bezier(.3,1.6,.5,1) both} @keyframes opbounce{from{transform:translateY(60px) scale(.6);opacity:0}}
.op-sweat{position:absolute;right:16%;top:14%;width:18px;height:26px;background:#8fd4ff;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:2px solid #3a2216;animation:opsweat 1.2s 1s ease-in infinite;opacity:0} @keyframes opsweat{0%{opacity:0;transform:translateY(-6px)}30%{opacity:1}100%{opacity:0;transform:translateY(20px)}}
.op-bub{position:absolute;left:8%;right:8%;top:9%;padding:12px 16px;background:#fff;border-radius:18px;box-shadow:0 0 0 3px #1d1630,0 5px 0 3px #1d1630;font-weight:800;font-size:clamp(16px,4.6vw,20px);line-height:1.5;color:#1d1630;text-align:center;animation:oppop .4s cubic-bezier(.3,1.6,.5,1) both}
.op-bub b{color:#e5393e}
@keyframes oppop{from{transform:scale(.5);opacity:0}}
.op-split{position:absolute;inset:0;background:linear-gradient(105deg,#e2672b 0 50%,#3d58c0 50% 100%)}
.op-split.dark{filter:brightness(.55)}
.op-nobori{position:absolute;top:12%;writing-mode:vertical-rl;padding:14px 8px;font-family:var(--f-wa);font-size:clamp(20px,6vw,28px);font-weight:700;color:#fff;border:3px solid #fff;border-radius:4px;animation:oppop .5s .3s both}
.op-nobori.A{left:10%;background:#a8401a} .op-nobori.B{right:10%;background:#2e3f8a}
.op-march{position:absolute;bottom:26%;display:flex;gap:2px}
.op-march svg{width:min(22vw,100px);height:auto;animation:opbob .35s ease-in-out infinite alternate}
.op-march.A{left:0;animation:opwalkA 2.6s ease-out both} .op-march.B{right:0;animation:opwalkB 2.6s ease-out both}
@keyframes opwalkA{from{transform:translateX(-110%)}} @keyframes opwalkB{from{transform:translateX(110%)}}
@keyframes opbob{to{transform:translateY(-6px)}}
.op-face{position:absolute;top:28%;width:min(46vw,210px)}
.op-face>svg:first-child{width:100%;height:auto}
.op-face.A{left:-4%;animation:opfaceA .9s cubic-bezier(.3,1.4,.5,1) both} .op-face.B{right:-4%;animation:opfaceB .9s cubic-bezier(.3,1.4,.5,1) both}
.op-face.B>svg:first-child{transform:scaleX(-1)}
@keyframes opfaceA{from{transform:translateX(-90%)}} @keyframes opfaceB{from{transform:translateX(90%)}}
.op-anger{position:absolute;top:0;width:34%;animation:oppop .3s 1s both,opshake .12s 1.1s 8} .op-face.A .op-anger{right:6%} .op-face.B .op-anger{left:6%}
.op-bolt{position:absolute;left:50%;top:24%;width:min(18vw,80px);translate:-50% 0;opacity:0;animation:opbolt .5s 1.1s both}
@keyframes opbolt{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.2)}40%{opacity:.3}60%{opacity:1;transform:scale(1)}100%{opacity:1}}
.op-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:opflash .5s 1.1s} @keyframes opflash{10%{opacity:.85}100%{opacity:0}}
.s5{animation:opfade .5s ease-out,opquake .4s 1.1s}
@keyframes opquake{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
@keyframes opshake{50%{transform:rotate(12deg) scale(1.1)}}
.op-idea{top:30%;width:min(52vw,230px);animation:opbounce .6s cubic-bezier(.3,1.6,.5,1) both}
.op-leaf{position:absolute;left:38%;top:-18%;width:26%;animation:opleafspin 1s .3s ease-in-out both} @keyframes opleafspin{from{transform:translateY(-40px) rotate(-200deg);opacity:0}}
.op-trick{position:absolute;right:6%;bottom:22%;width:min(28vw,120px);aspect-ratio:1}
.op-trick svg{position:absolute;inset:0;width:100%;height:100%}
.op-trick .d{animation:optrickd 1.8s both} .op-trick .c{opacity:0;animation:optrickc .4s 1.7s both}
@keyframes optrickd{0%{transform:translateX(60px);opacity:0}30%{transform:none;opacity:1}88%{opacity:1}100%{opacity:0}} @keyframes optrickc{from{opacity:0;transform:scale(.6)}to{opacity:1}}
.op-smoke{position:absolute;inset:-20%;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,#fff 0 40%,#fff0 70%);font-family:var(--f-display);font-size:18px;color:#6a4c8c;opacity:0;animation:opsmoke .8s 1.5s both} @keyframes opsmoke{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.4)}}
.op-rays{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,#e2672b 0 10deg,#f08a4a 10deg 20deg);animation:oprays 12s linear infinite}
.op-rays::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 50%,#3d58c0d0 50%)}
@keyframes oprays{to{transform:rotate(360deg)}}
.op-logo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.op-logo .ttl-logo{animation:oplogo .6s .2s cubic-bezier(.2,1.6,.4,1) both} @keyframes oplogo{from{transform:scale(2.4);opacity:0}}
.op-logo .ttl-pill{animation:oppop .4s both}
.op-copy{margin:0;padding:6px 18px;background:#fff8ec;border-radius:8px;font-family:var(--f-wa);font-size:20px;color:#1d1630;box-shadow:0 4px 0 #1d1630;animation:oppop .4s .9s both}
.op-copy b{color:#e5393e}
.op-tapnext{margin:18px 0 0;color:#fff;font-weight:800;letter-spacing:.1em;text-shadow:0 2px 0 #1d1630;animation:opfade .5s 1.8s both,ttlblink 1.1s 2.3s infinite}
@media (prefers-reduced-motion:reduce){.op *{animation-duration:.01s!important;animation-iteration-count:1!important}}
.ttl-tap{border:0!important;box-shadow:none!important;outline:none}
.ttl-tap:focus-visible{outline:none}
.op-march{width:50%;justify-content:center}
.op-march.A{left:0} .op-march.B{right:0;left:auto}
.op-march svg{width:min(15vw,70px)!important}

/* オープニング（わかりやすい版） */
.op-lan{filter:drop-shadow(0 0 8px #ffb35a)}
.op-pair{position:absolute;left:0;right:0;bottom:16%;display:flex;justify-content:center;gap:12%}
.op-walk{display:flex;flex-direction:column;align-items:center;gap:4px}
.op-walk .op-g{width:min(28vw,124px);height:auto;animation:opbob .35s ease-in-out infinite alternate}
.op-walk b{padding:2px 14px;border-radius:999px;color:#fff;font-size:18px;font-weight:900;box-shadow:0 0 0 3px #1d1630}
.op-walk.A b{background:#e2672b} .op-walk.B b{background:#3d58c0}
.op-walk.A{animation:opwalkA 1.8s ease-out both} .op-walk.B{animation:opwalkB 1.8s ease-out both}
.op-rooms{position:absolute;left:50%;top:30%;translate:-50% 0;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:0;width:min(88vw,400px);padding:10px;background:#5e3620;border-radius:6px;box-shadow:0 0 0 4px #2e180c,0 10px 0 4px #0004}
.op-rooms::before{content:"";position:absolute;left:-14px;right:-14px;top:-34px;height:32px;background:#2b3250;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.op-rm{aspect-ratio:1/1.1;margin:4px;background:linear-gradient(#fff6dc,#ffcf72);border:3px solid #2e180c;border-radius:3px;display:grid;place-items:end center;position:relative}
.op-rm .op-g{width:86%;height:auto}
.op-rm.empty::after{content:"空き";position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:#c9a46a;font-size:18px}
.op-g.drop{animation:opdrop .6s .6s cubic-bezier(.3,1.5,.5,1) both} @keyframes opdrop{from{transform:translateY(-140px);opacity:0}}
.op-rm.hit{animation:opredden .3s 1.4s both} @keyframes opredden{to{background:linear-gradient(#ffd6d0,#ff8a7a)}}
.s4 .op-rooms{animation:opquake .45s 1.5s}
.op-boom{position:absolute;left:50%;top:20%;translate:-50% 0;display:flex;flex-direction:column;align-items:center}
.op-boom .op-bolt{position:static;translate:none;width:min(16vw,70px)}
.op-boom b{font-family:var(--f-display);font-size:clamp(28px,9vw,40px);color:#e5393e;-webkit-text-stroke:2px #fff;paint-order:stroke;opacity:0;animation:oppop .35s 1.5s both}
.s4 .op-bolt{animation:opbolt .5s 1.4s both} .s4 .op-flash{animation:opflash .5s 1.4s}
.op-mark{position:absolute;left:50%;bottom:23%;translate:-50% 0;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:54px;font-weight:900;color:#fff;box-shadow:0 0 0 4px #fff,0 6px 0 4px #0004;opacity:0;animation:oppop .4s 1.8s cubic-bezier(.3,1.6,.5,1) both}
.op-mark.ng{background:#e5393e} .op-mark.ok{background:#3f9a4a}
.op-coins{position:absolute;left:0;right:0;top:24%;height:0}
.op-coins svg{position:absolute;left:calc(30% + var(--i)*10%);width:34px;height:34px;opacity:0;animation:opcoin 1.4s calc(1.2s + var(--i)*.12s) ease-out both}
@keyframes opcoin{0%{opacity:0;transform:translateY(60px) scale(.5)}30%{opacity:1;transform:translateY(-20px) scale(1.1)}100%{opacity:0;transform:translateY(-90px)}}
.op-mark,.op-boom b{opacity:1!important}
.op-rooms{left:6%!important;right:6%!important;width:auto!important;translate:none!important;box-sizing:border-box}
.op-ponko .worry{display:none!important} .op-ponko .happy{display:inline!important}
.op-boom b{display:none!important}
.op-mark{width:auto!important;height:auto!important;display:flex!important;align-items:center;gap:8px;padding:8px 22px 8px 10px;border-radius:999px!important;font-size:clamp(24px,7vw,32px)!important;font-family:var(--f-display);white-space:nowrap}
.op-mark i{font-style:normal;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;font-family:var(--f-body)}
.op-mark.ng i{color:#e5393e} .op-mark.ok i{color:#3f9a4a}

/* オープニング（物語の予告） */
.op-ponko.low{top:44%;width:min(46vw,200px)}
.op-ponko.sad .happy{display:none!important} .op-ponko.sad .worry{display:inline!important}
.s2 .op-rooms{top:12%}
.s2 .op-bub{top:auto;bottom:24%}
.op-split.A1{background:linear-gradient(160deg,#f08a4a,#a8401a)} .op-split.B1{background:linear-gradient(160deg,#5a70d0,#2e3f8a)}
.op-boss{position:absolute;top:30%;width:min(64vw,280px);left:50%;translate:-50% 0}
.op-boss svg{width:100%;height:auto;filter:drop-shadow(0 8px 0 #0004)}
.op-boss.A{animation:opfaceA .7s cubic-bezier(.3,1.4,.5,1) both} .op-boss.B{animation:opfaceB .7s cubic-bezier(.3,1.4,.5,1) both}
.op-bub.A{box-shadow:0 0 0 3px #a8401a,0 5px 0 3px #a8401a} .op-bub.B{box-shadow:0 0 0 3px #2e3f8a,0 5px 0 3px #2e3f8a}
.op-bub.A b{color:#e2672b} .op-bub.B b{color:#3d58c0}
.s5 .op-face{top:16%;width:min(40vw,180px)}
.s5 .op-bolt{top:12%;animation:opbolt .5s .4s both} .s5 .op-flash{animation:opflash .5s .4s} .s5 .op-anger{animation:oppop .3s .3s both,opshake .12s .4s 8}
.s5{animation:opfade .5s ease-out,opquake .4s .4s}
.op-tug{position:absolute;left:4%;right:4%;top:52%;display:flex;justify-content:space-between}
.op-tug span{padding:6px 12px;border-radius:12px;color:#fff;font-weight:900;font-size:clamp(15px,4.4vw,19px);box-shadow:0 0 0 3px #fff;animation:oppop .3s both}
.op-tug b{color:#ffe14a} .op-tug .A{background:#e2672b;animation-delay:.9s} .op-tug .B{background:#3d58c0;animation-delay:1.3s}
.op-pulled{top:auto;bottom:16%;width:min(40vw,170px);animation:optug 1.1s 1s ease-in-out infinite}
@keyframes optug{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-26%) rotate(-10deg)}75%{transform:translateX(26%) rotate(10deg)}}
.op-ponko.sly{top:34%}
.op-kira{position:absolute;right:4%;top:2%;font-family:var(--f-display);font-size:44px;color:#ffe14a;-webkit-text-stroke:2px #1d1630;paint-order:stroke;animation:oppop .3s 1.2s both}
.s6 .op-bub{top:auto;bottom:24%}
.op-rm.shh::after{content:"空き";position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:#c9a46a;font-size:18px}
.s7 .op-rooms{top:26%}
.s7 .op-mark{bottom:auto;top:58%}
.s7 .op-cap{font-size:clamp(15px,4.4vw,19px)}
/* タイトル：順番に出てくる */
.ttl{position:relative;overflow:hidden}
.ttl>*{position:relative;z-index:1}
.ttl-rays{position:absolute!important;z-index:0!important;left:50%;top:26%;width:220vmax;height:220vmax;translate:-50% -50%;background:repeating-conic-gradient(from 0deg,#ffffff1c 0 10deg,transparent 10deg 20deg);border-radius:50%;pointer-events:none;animation:tr-in .9s .25s ease-out both,oprays 30s linear infinite}
@keyframes tr-in{from{opacity:0;scale:.3}}
.ttl.intro .ttl-pill{animation:tdrop .45s .05s cubic-bezier(.3,1.6,.5,1) both}
@keyframes tdrop{from{translate:0 -60px;opacity:0}}
.ttl.intro .ttl-logo{animation:tslam .55s .3s cubic-bezier(.2,1.6,.4,1) both,noren 3.2s 1.2s ease-in-out infinite}
@keyframes tslam{from{scale:2.6;opacity:0}}
.ttl.intro .ttl-art{animation:trise .6s .95s cubic-bezier(.3,1.4,.5,1) both}
@keyframes trise{from{translate:0 50px;opacity:0}}
.ttl.intro .ttl-art .ttl-zap{opacity:0;animation:tzapin .3s 1.55s both,tzap .9s 1.9s steps(2) infinite}
@keyframes tzapin{from{opacity:0;scale:.3}to{opacity:1}}
.ttl.intro .ttl-copy{animation:tpop .4s 1.75s cubic-bezier(.3,1.6,.5,1) both}
@keyframes tpop{from{scale:.3;opacity:0}}
.ttl.intro .ttl-sub{animation:opfade .5s 2.05s both}
.ttl.intro .ttl-tap{animation:opfade .4s 2.3s both,ttlblink 1.1s 2.7s ease-in-out infinite}
.ttl.intro .ttl-cfg{animation:opfade .4s 2.4s both}
@media (prefers-reduced-motion:reduce){.ttl.intro *{animation-duration:.01s!important;animation-delay:0s!important}}
.op-pulled{bottom:auto!important;top:55%;width:min(34vw,150px)!important}
.op-tug{top:45%!important}
/* ステージ選択：面の色は時間帯に関係なく統一 */
.tile.th-hiru,.tile.th-yu,.tile.th-asa,.tile.th-yoru{background:var(--cream)!important;color:var(--ink)!important}
.tile.th-yoru small i{color:#d9cdb5!important}
.tile.cur{outline:3px solid var(--pop-o);outline-offset:2px}
/* プレイ画面をさらに高く：上のメーターと女将の欄を薄く */
.hud .meter{padding:3px 8px 5px!important;row-gap:0}
.hud .meter .lbl{font-size:10px!important;line-height:1.2}
.hud .meter .val{font-size:clamp(17px,5vw,21px)!important;line-height:1}
.hud .ibtn{max-height:24px!important}
.deck{height:58px!important}
.talk{height:58px!important;padding:3px 10px 3px 6px!important;gap:6px!important}
.portrait{width:36px!important;height:36px!important}
.talk .say{font-size:11.5px!important;line-height:1.3!important}
.mis{font-size:9.5px!important;line-height:1.25!important;padding:0 6px!important}
.deck .sp{width:54px!important;height:54px!important}
.deck .sp b{font-size:13px!important} .deck .sp small{font-size:10px!important}
.stage{height:calc(100vh - 150px)!important;height:calc(100dvh - 150px)!important}
.hud .meter .val{font-size:clamp(16px,4.6vw,20px)!important}
.hud .meter .val small{font-size:.48em!important;margin-left:1px!important}
.talk .tk{padding-top:2px}
.fus.low{animation:blink .35s ease-in-out infinite alternate}
/* いぬ・ねこ・うさぎを色で見分ける */
.guest.queued.sp-A{background:#ffe3cf;box-shadow:inset 0 0 0 2.5px #ff7a2a}
.guest.queued.sp-B{background:#dfe6ff;box-shadow:inset 0 0 0 2.5px #3f63e0}
.guest.queued.sp-C{background:#dcf3df;box-shadow:inset 0 0 0 2.5px #3fae55}
.guest.queued.sel{background:#fff3b0!important;box-shadow:0 0 0 3px #ffcf3a,0 0 14px #ffe08a!important}
.guest.queued.hurry{background:#ffdcd6!important;box-shadow:0 0 0 3px #e5393e!important}

/* 迷ったときの助け */
.hintroom{position:absolute;z-index:2;border-radius:6px;pointer-events:none;box-shadow:inset 0 0 0 3px #ffe14a,0 0 18px #ffe14a;animation:hintpulse 1.1s ease-in-out infinite}
@keyframes hintpulse{50%{box-shadow:inset 0 0 0 3px #ffe14a88,0 0 6px #ffe14a55}}
.guest.queued.nudge .art{animation:nudgeart .9s ease-in-out infinite!important}
@keyframes nudgeart{50%{translate:0 -6px}}
.guest.queued.nudge{box-shadow:0 0 0 3px #ffe14a,0 0 12px #ffe14a!important}
.nexttip{width:100%;box-sizing:border-box;text-align:left;padding:8px 12px 6px;border-radius:10px;background:#fff8dc;box-shadow:inset 0 0 0 2px #e8c35a}
.nexttip .nt-h{display:inline-block;margin-bottom:2px;padding:0 10px;border-radius:999px;background:#3f9a4a;color:#fff;font-size:12px}
.nexttip p{margin:4px 0;font-size:12.5px;font-weight:700;line-height:1.45;color:var(--ink)}
.nexttip p::before{content:"💡";margin-right:4px}
.pz-rules{width:min(86%,340px);max-height:45%;overflow:auto;padding:10px 12px;border-radius:12px;background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:12px;text-shadow:none;text-align:left}
.pz-rules .pz-h{display:block;font-size:13px;margin-bottom:4px}
.pz-rules .pz-mis{margin:6px 0 0;font-weight:800}
/* 演出 */
.chainfl{position:absolute;z-index:4;border-radius:6px;pointer-events:none;box-shadow:inset 0 0 0 4px #ffd84a,0 0 22px #ffd84a;animation:chainfl .9s ease-out forwards}
@keyframes chainfl{0%{opacity:0;transform:scale(.9)}25%{opacity:1;transform:scale(1.03)}100%{opacity:0;transform:scale(1)}}
.rainfx{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .8s;border-radius:inherit;
  background:repeating-linear-gradient(105deg,transparent 0 31px,rgba(210,230,255,.5) 31px 32.5px,transparent 32.5px 61px),repeating-linear-gradient(98deg,transparent 0 47px,rgba(210,230,255,.35) 47px 48px,transparent 48px 83px);
  background-size:61px 140px,83px 190px;animation:rainmv .5s linear infinite}
.stage.rainy .rainfx{opacity:.55}
@keyframes rainmv{to{background-position:-38px 140px,-27px 190px}}
@media (prefers-reduced-motion:reduce){.rainfx{animation:none}}
.tensefx{display:none;position:absolute;inset:0;z-index:7;pointer-events:none;border-radius:inherit}
.stage.tense .tensefx{display:block;box-shadow:inset 0 0 40px 10px #e5393e99;animation:tense .85s ease-in-out infinite}
@keyframes tense{50%{box-shadow:inset 0 0 18px 4px #e5393e55}}
.noren-open{position:absolute;inset:0;z-index:9;pointer-events:none;display:flex}
.noren-open i{flex:1;background:repeating-linear-gradient(90deg,#2b3a7a 0 30px,#24326a 30px 32px);display:grid;place-items:center;font-style:normal;animation:norenL .9s .15s cubic-bezier(.6,0,.4,1) forwards}
.noren-open i+i{animation-name:norenR}
.noren-open b{font-family:var(--f-wa);font-size:56px;color:#fff;opacity:.9}
@keyframes norenL{to{transform:translateX(-102%) skewX(-6deg)}} @keyframes norenR{to{transform:translateX(102%) skewX(6deg)}}
.scroll.perfect{box-shadow:0 0 0 4px #ffd84a,0 0 30px #ffd84a,0 0 0 9px #1d1630!important;animation:perfectglow 1.6s ease-in-out infinite}
@keyframes perfectglow{50%{box-shadow:0 0 0 4px #fff2a8,0 0 44px #ffd84a,0 0 0 9px #1d1630}}
.perfect-ribbon{align-self:center;margin:-2px 0 4px;padding:4px 22px;border-radius:6px;background:linear-gradient(90deg,#c8891a,#ffd84a,#c8891a);color:#3a2216;font-family:var(--f-display);font-size:18px;letter-spacing:.06em;box-shadow:0 3px 0 #7a4a12;animation:tslam .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.scroll.perfect .hanko{color:#c8891a!important;border-color:#c8891a!important}
.thn.shp{background:#6a4c8c;margin-left:4px}
.ghost .angerm{display:none!important}
svg .worry{display:none}
.talk.bad .portrait svg .worry{display:inline}
.talk.bad .portrait svg .happy{display:none}
/* 章と試練 */
.tiles .chap{grid-column:1/-1;margin:8px 2px 0;padding:3px 10px;border-radius:6px;background:#1e2740;color:#ffe08a;font-family:var(--f-wa);font-size:14px;letter-spacing:.08em;box-shadow:inset 0 0 0 1.5px #e8b84a66}
.tile.trial{background:linear-gradient(180deg,#fff2b0,#e9b33a)!important;box-shadow:0 0 0 3px #7a4a12,0 4px 0 3px var(--navy)!important}
.tile.trial::after{content:"試練";position:absolute;left:50%;bottom:-7px;translate:-50% 0;padding:0 6px;border-radius:999px;background:#7a4a12;color:#fff;font-family:var(--f-body);font-size:9px;font-weight:900;line-height:1.5}
.chapline{margin:0 0 -4px;font-family:var(--f-wa);font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.trialtag{padding:1px 10px;border-radius:999px;background:linear-gradient(90deg,#c8891a,#ffd84a);color:#3a2216;font-size:12px}
.qb .fastb{background:#fff;border-radius:50%;box-shadow:0 0 0 2px #c0391e}
.ptag.fast{box-shadow:0 0 0 2.5px #c0391e,0 2px 0 2px var(--navy)!important}
.ptag.fast .pr{color:#c0391e}
</style>

<script>
/* ================= ルール ================= */
const TYPES={
  s:{name:'こども',pay:20,stay:5,pat:9},
  c:{name:'家族づれ',pay:40,stay:8,pat:8},
  v:{name:'お大尽',pay:90,stay:5,pat:5}
};
const AN={A:'いぬ',B:'ねこ',C:'うさぎ'};
const ALL_EV=['catfes','dogfes','leak','party','raid','rush'];
const UNLOCK={tags:3,rabbit:6,req:9,foes:12,wish:15,ev:18,scroll:22,trait:22};
function edgeKey(a,b){return a<b?a+'-'+b:b+'-'+a}
function genWalls(n,cols,fl){
  const v=(c,rows)=>rows.map(r=>edgeKey(r*cols+c,r*cols+c+1));      // 列cと列c+1の間（縦の壁）
  const h=(r,cs)=>cs.map(c=>edgeKey(r*cols+c,(r+1)*cols+c));        // 階rと階r+1の間（横の壁）
  const allR=[...Array(fl).keys()], allC=[...Array(cols).keys()];
  if(n<=16) return v(0,allR);
  let seed=(n*2654435761)>>>0; const rnd=()=>{seed=(seed+0x6D2B79F5)>>>0;let t=seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296};
  let pat=Math.floor(rnd()*6); if(n>=60&&rnd()<.45) pat=rnd()<.5?0:3; // 後半は壁の少ない間取りを増やす
  const vc=Math.floor(rnd()*(cols-1)), hr=Math.floor(rnd()*(fl-1));
  const half=allR.filter(r=>rnd()<.5||r===0);
  switch(pat){
    case 0: return [];                                        // 壁なし
    case 1: return v(vc,allR);                                // 縦に一枚
    case 2: return h(hr,allC);                                // 横に一枚（階を分ける）
    case 3: return v(vc,half);                                // 一部の階だけ
    case 4: return [...v(vc,allR.filter(r=>r!==hr)),...h(hr,allC.filter(c=>c!==vc))]; // 十字（真ん中が抜けている）
    default: return [...h(hr,allC.slice(0,Math.ceil(cols/2))),...v(cols-2,allR.slice(0,hr+1))]; // L字
  }

/* 部屋選びのガイド */
function drawRooms(){
  const rl=$('rooms'); rl.innerHTML='';
  if(S.fmode){
    const x0=L.cx-L.sw/2;
    for(let i=0;i<S.rooms;i++) for(const j of [i+1,i+S.cols]){
      if(j>=S.rooms||(j===i+1&&(i%S.cols)===S.cols-1)) continue;
      if(S.holes.includes(i)||S.holes.includes(j)) continue;
      const k=edgeKey(i,j); if(S.walls.includes(k)) continue;
      const on=S.fus.includes(k), c=i%S.cols, r=(i/S.cols)|0; if(on) continue;
      const x=j===i+1?x0+L.bw*(c+1):x0+L.bw*(c+.5), y=j===i+1?L.top+L.bh*(r+.5):L.top+L.bh*(r+1);
      if(!on&&S.fstock<=0) continue;
      const b=document.createElement('button'); b.className='ebtn'+(on?' on':''); b.dataset.edge=k;
      b.setAttribute('aria-label',on?'ふすまを外す':'ここにふすまを置く');
      b.style.left=x+'px'; b.style.top=y+'px'; b.textContent=on?'×':'+';
      rl.appendChild(b);
    }
    return;
  }
  const g=selGuest();
  if(!g){ // 6秒置かずにいたら、いちばん待ちくたびれているお客と、置ける部屋をそっと光らせる
    els.forEach(o=>o.el.classList.remove('nudge'));
    if(S.idleT>=IDLE_HINT&&S.scene==='play'){ const qs=[...S.q.A,...S.q.B].sort((a,b)=>a.pat/a.patMax-b.pat/b.patMax), q=qs[0];
      if(q){ let bi=-1,bm2=-1; for(let i=0;i<S.rooms;i++){if(S.room[i]||isOff(i))continue;const p=preview(q,i);if(!p.fight&&p.mult>bm2){bm2=p.mult;bi=i}}
        const o=els.get(q.id); if(o) o.el.classList.add('nudge');
        if(bi>=0){const x0=L.cx-L.sw/2,c=bi%L.cols,r=(bi/L.cols)|0,d=document.createElement('div');d.className='hintroom';
          d.style.cssText=`left:${x0+L.bw*c+6}px;top:${L.top+L.bh*r+6}px;width:${L.bw-12}px;height:${L.bh-12}px`; rl.appendChild(d)} } }
    return; }
  const x0=L.cx-L.sw/2;
  let best=-1,bm=-1;
  if(SV.easy) for(let i=0;i<S.rooms;i++){if(S.room[i]||isOff(i))continue;const p=preview(g,i);if(!p.fight&&p.mult>bm+.001){bm=p.mult;best=i}}
  const gi=roomOf(g.id);
  if(gi>=0){
    const gp=L.cell(gi);
    const k=document.createElement('button');k.className='kickbtn';k.dataset.kick=g.id;
    k.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6 L18 18 M18 6 L6 18" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>お帰りいただく';
    k.style.left=gp.x+'px'; k.style.translate='-50% 0'; k.style.top=(gp.y+L.bh/2-16)+'px';
    rl.appendChild(k);
  }
  for(let i=0;i<S.rooms;i++){
    if(S.room[i]||isOff(i)) continue;
    const p=preview(g,i), c=i%L.cols, r=(i/L.cols)|0;
    const cls=p.fight?'bad':p.mult>=1.45?'gold':p.mult<.95?'warn':'ok';
    const lab=(i===best?'★':'')+(p.fight?'ケンカ':'×'+fmt(p.mult));
    const sm=L.bw<95, wish=p.fight?'':(p.wish?`<em class="wi">希望◎</em>`:'')+(p.harm?`<em class="no">となり↓</em>`:'')+(p.help?`<em>となり↑</em>`:'');
    const b=document.createElement('button');
    b.className='rbtn '+cls+(L.bw<95?' sm':'')+(i===best?' best':''); b.dataset.r=i;
    b.setAttribute('aria-label',`${L.fl-r}階${c+1}号室：${p.fight?'ケンカになる':'お代'+fmt(p.mult)+'倍'}${p.harm?'、となりのお代が下がる':''}`);
    b.style.cssText=`left:${x0+L.bw*c+6}px;top:${L.top+L.bh*r+6}px;width:${L.bw-12}px;height:${L.bh-12}px`;

}

function layout(){
  const w=stage.clientWidth,h=stage.clientHeight;
  const cols=(S&&S.cols)||2, fl=(S&&S.floors)||3;
  // 下の縁台（待合）：いぬは左、ねこは右に3人ずつ
  // 待合：上の段がいぬ、下の段がねこ。左に組合の札、右に3つの席（お客どうしが重ならない）
  const labW=Math.round(Math.min(88,Math.max(68,w*.23))), slotW=(w-16-labW)/MAXQ, rowH=Math.round(Math.max(60,Math.min(78,slotW*.84,h*.115))), qW=rowH-29, trayH=rowH*2+18, trayTop=h-trayH;
  const rowY=f=>trayTop+7+(f==='A'?0:rowH+4);
  const sw=Math.min(w-12, cols*150), bw=sw/cols;

  L={w,h,sw,bw,bh,top,H,cols,fl,qW,trayTop,trayH,slotW,cx:w/2,colW:w/2,
     dW:Math.min(bh*.98,bw*.78),
     labW,rowH,rowY,roofH,
     qp:(f,i)=>({x:10+labW+slotW*(i+.5), y:rowY(f)+rowH/2}),
     qx:{A:w/4,B:w*3/4},

  const ta=document.querySelector('.lane-tag.A'), tb=document.querySelector('.lane-tag.B');
  if(ta){for(const [el,f] of [[ta,'A'],[tb,'B']]){el.style.top=rowY(f)+'px';el.style.left='6px';el.style.width=labW+'px';el.style.height=rowH+'px'}}
  // 看板の位置（お知らせの帯を看板の上にぴったり重ねる）
  { const eY=top+2, rY=top-roofH, sh=Math.min(32,(eY-rY)*.62);
    stage.style.setProperty('--signY',(rY+(eY-rY-sh)/2)+'px'); stage.style.setProperty('--signH',sh+'px'); stage.style.setProperty('--signW',(sw*.62)+'px'); }
}

function drawInn(){
  const {w,h,sw,bw,bh,top,cx,cols,fl}=L, x0=cx-sw/2, x1=x0+sw, H=bh*fl;

    <radialGradient id="gLan"><stop offset="0" stop-color="#ffd27a" stop-opacity=".85"/><stop offset="1" stop-color="#ffb35a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gLanBody" cx=".4" cy=".35"><stop offset="0" stop-color="#ff9a6a"/><stop offset=".6" stop-color="#d8432e"/><stop offset="1" stop-color="#8f2618"/></radialGradient>
  </defs>`;
  s+=`<ellipse cx="${cx}" cy="${base+26}" rx="${sw*.85}" ry="14" fill="#3a2216" opacity=".28"/>`;

      <rect x="${tx-4.5}" y="${ty-29}" width="9" height="6" fill="#ffd27a" stroke-width="1"/>
      <path d="M${tx-13} ${ty-32} L${tx} ${ty-42} L${tx+13} ${ty-32} Z" fill="url(#gStone)"/>

  }
  s+=`<rect class="halo" x="${x0-10}" y="${top-8}" width="${sw+20}" height="${H+20}" rx="10"/>`;
  // 外壁と柱

      s+=`<rect x="${x0+bw*c-1}" y="${top+bh*r-1}" width="${bw+2}" height="${bh+(r===fl-1?7:2)}" fill="url(#gWall)"/>`; }
    for(let i=0;i<cols*fl;i++){ if(HL.includes(i)) continue; const c=i%cols, r=(i/cols)|0, bx=x0+bw*c, by=top+bh*r;

function foePos(f,i){
  const size=L.qW*(f.boss?1.45:.95);
  const doorY=L.top+L.H+22;

  const endX=Math.max(size*.55,Math.min(L.w-size*.55,L.cx+f.side*(L.sw*0.2+i*size*0.5)));

function stepFoes(dt,D){
  if(D.foes) S.foeT-=dt;

  if(D.boss&&!S.bossDone&&S.t<=D.boss.at){S.bossDone=true;spawnFoe(true)}
  let changed=false;
  for(const f of S.foes){
    const was=f.p<1; f.p+=dt/f.walk;
    if(was&&f.p>=1) changed=true;
    if(f.p>=1){
      f.stealT-=dt;
      if(f.stealT<=0){
        f.stealT=1;
        const amt=Math.min(S.cr,f.boss?15:5);
        if(amt>0){S.cr-=amt;S.total-=amt;S.stat.stolen+=amt;const q=foeScreen(f);pop(`-${amt}円`,q.x,q.y-q.size*0.6,'bad');sfx('steal')}
      }
    }
  }
  const at=S.foes.filter(f=>f.p>=1);

  S.atkT-=dt;

// <audio>で再生（iPhoneのマナーモードでも鳴り、読み込みも安定）。音量はWeb Audioのゲインで調整
function loadTrack(k){
  const T=TRACKS[k]; if(T.state!=='none') return; T.state='loading';
  const el=new Audio(), ogg=!!T.ogg&&!!el.canPlayType('audio/ogg; codecs="vorbis"');
  el.preload='auto'; el.loop=true; el.setAttribute('playsinline',''); T.el=el;
  const fail=()=>{if(T.state==='ready')return; T.state='fail'; if(BGM.mode===k){BGM.mode=null;bgm(k)} setTimeout(loadBgmFile,0)};
  const to=setTimeout(fail,12000);
  el.addEventListener('canplay',()=>{clearTimeout(to); if(T.state!=='loading')return; T.state='ready';
    T.lp=T.loop||[0,0];
    if(BGM.mode===k){BGM.mode=null;bgm(k)} setTimeout(loadBgmFile,0)},{once:true});
  el.addEventListener('error',()=>{clearTimeout(to);fail()},{once:true});
  // ループ素材の境目と曲の前後の無音を飛ばす
  el.addEventListener('timeupdate',()=>{if(T.lp[1]&&el.currentTime>=T.lp[1]-.05) el.currentTime=T.lp[0]});
  // すぐに読み込みを始める（少し読めた時点で鳴らせる）。iPhoneのようにタップ前は読み込まないブラウザでは、
  // 先にファイルだけ取っておき、タップ後の読み込みを一瞬で済ませる
  const url=ogg?T.ogg:T.mp3; el.src=url; el.load();
  if(location.protocol.startsWith('http')&&window.fetch) setTimeout(()=>{ if(T.state==='loading'&&el.readyState===0&&!(el.buffered&&el.buffered.length)) fetch(url,{cache:'force-cache'}).catch(()=>{}) },400);
}
// タイトルの曲をいちばん先に。読み終わったら残りを1曲ずつ（回線を取り合わない）
function loadBgmFile(){
  loadTrack('menu'); if(TRACKS.menu.state==='loading') return;
  for(const k of ['story','play','fail']){ if(TRACKS[k].state==='none'){loadTrack(k);return} if(TRACKS[k].state==='loading') return; }
}
// タップの瞬間に、まだ鳴らしていない<audio>を一度だけ鳴らして止める（iPhoneの自動再生制限を解く）
function unlockTracks(){for(const k in TRACKS){const T=TRACKS[k]; if(!T.el||T.unlocked||T.src)continue; T.unlocked=true; const v=T.el.muted; T.el.muted=true;
  const pr=T.el.play(); if(pr&&pr.then) pr.then(()=>{if(!T.src){T.el.pause()} T.el.muted=v}).catch(()=>{T.unlocked=false;T.el.muted=v}); }}
function trackGain(k){
  const T=TRACKS[k]; if(T.gain||!ac) return;
  try{T.node=ac.createMediaElementSource(T.el); T.filt=ac.createBiquadFilter(); T.filt.type='lowpass'; T.filt.frequency.value=20000; T.gain=ac.createGain(); T.gain.gain.value=0; T.node.connect(T.filt).connect(T.gain).connect(ac.destination)}catch(e){T.gain=null}
}
function trackStart(k){
  const T=TRACKS[k]; if(T.src) return;
  trackGain(k); T.src=true;
  try{T.el.currentTime=T.lp[0]||0}catch(e){}
  if(T.gain){const t=ac.currentTime; T.gain.gain.cancelScheduledValues(t); T.gain.gain.setValueAtTime(0,t)} else T.el.volume=0;
  T.el.muted=false;
  const pr=T.el.play(); if(pr&&pr.catch) pr.catch(()=>{T.src=null; T.retry=true});
}
function trackStop(k){
  const T=TRACKS[k]; if(!T.src) return; T.src=null;
  if(T.gain){const t=ac.currentTime; T.gain.gain.cancelScheduledValues(t); T.gain.gain.setValueAtTime(T.gain.gain.value,t); T.gain.gain.linearRampToValueAtTime(0,t+.5)}
  setTimeout(()=>{if(!T.src)T.el.pause()},550);
}

const ROOT=[0,0,5,7,0,9,5,7]; // 小節ごとの根音（半音）
function bgmStepPlay(st,t,out){
  const bar=(st>>4)%8, s=st%16, inten=S&&S.scene==='play'&&S.t<15;
  if(BGM.mode==='play'){
    // 太鼓
    if(s===0||s===8||(s===6&&bar%2===0)||(s===14&&bar%2)) taiko(t,{v:.32,out});
    if(s===4||s===12) ka(t,{v:.1,out});
    if(inten&&s%2===1) ka(t,{v:.05,out});
    if(bar===7&&s>=8&&s%2===0) taiko(t,{v:.22+s*.01,f:120,out});
    if(s===0&&bar%4===0) suzu(t,{n:4,v:.025,out});
    // 三味線のベース（8分）
    if(s%2===0){const r=ROOT[bar], pat=[0,12,7,12,0,12,7,9][s/2]; shami(ST(130.81,r+pat),t,{v:.045,d:.16,out})}
    // 琴のメロディ
    if(s%2===0){const n=MEL[bar][s/2]; if(n!=null) koto(ST(261.63,yo(n)+12),t,{d:.7,v:.06,out,rv:.6})}
    // かけ声代わりの拍子木（4小節ごと）
    if(s===12&&bar===3) hyoshi(t,{v:.08,out});
  }else{
    // メニュー：ゆったり琴のアルペジオ＋笛
    const r=[0,5,7,0][bar%4];
    if(s%2===0){const seq=[0,2,4,7,9,7,4,2]; koto(ST(130.81,r+seq[s/2]+(s>=8?12:0)),t,{d:1.2,v:.09,out,rv:.8})}
    if(s===0&&bar%2===0) fue(ST(523.25,[7,4,9,7][(bar/2|0)%4]),t,1.6,{v:.07,out});
    if(s===0&&bar===0) rin(1046.5,t,{d:2.5,v:.06,out});
  }
}
function bgmTick(){
  if(!ac||!BGM.mode) return;
  const bpm=BGM.mode==='play'?(S&&S.t<15&&S.scene==='play'?138:124):76, dur=60/bpm/4;
  if(BGM.next<ac.currentTime) BGM.next=ac.currentTime+.05;
  while(BGM.next<ac.currentTime+.15){ VOLK=1; try{bgmStepPlay(BGM.step,BGM.next,BGM.bus)}catch(e){} BGM.next+=dur; BGM.step++; }
}
function bgm(mode){
  if(BGM.mode===mode) return;
  BGM.mode=mode; if(TRACKS[mode])loadTrack(mode); if(!ac) return; sfxBus(); loadBgmFile();
  if(!BGM.bus){BGM.bus=ac.createGain();BGM.bus.gain.value=.45;BGM.bus.connect(sfxOut)}
  BGM.step=0; BGM.next=ac.currentTime+.08;
  // ファイルの曲があればそれを、読み込めなかったときは自作の曲（ストーリーは琴の曲）
  const T=TRACKS[mode], useFile=!!T&&T.state!=='fail';
  for(const k in TRACKS) if(k!==mode||!useFile) trackStop(k);
  if(useFile&&T.state==='ready') trackStart(mode);
  const synth=mode&&mode!=='fail'&&!useFile;
  if(synth&&!BGM.timer) BGM.timer=setInterval(bgmTick,25);
  if(!synth&&BGM.timer){clearInterval(BGM.timer);BGM.timer=null}
}
// 画面に合わせてBGMを切り替え、ミュート・一時停止では音量を下げる
function bgmSync(){
  if(!ac) return;
  const cfgOpen=!$('setDlg').hidden;
  const want=(cfgOpen||OP)?'menu':VN?'story':!S||S.scene!=='play'&&S.scene!=='result'?'menu':S.scene==='play'?'play':(S.result!=='clear'&&!scr.hidden?'fail':null);
  bgm(want);
  const vol=muted?0:(SV.cfg.bgm/70)*(S&&S.paused&&!cfgOpen?.3:1);
  if(BGM.bus) BGM.bus.gain.setTargetAtTime(.45*vol,ac.currentTime,.1);
  for(const k in TRACKS){const T=TRACKS[k]; if(!T.src) continue;
    if(T.gain) T.gain.gain.setTargetAtTime(T.vol*vol,ac.currentTime,.1); else T.el.volume=Math.min(1,T.vol*vol*2.5)}
  // 章・場面で曲の表情を変える：せっかち＝少し速く、試練＝少し速く、残り10秒＝さらに速く、長雨＝こもった音、満月＝やわらかい音
  { const m=bgmMood(), P=TRACKS.play;
    if(P.el&&Math.abs((P.el.playbackRate||1)-m.rate)>.001){try{P.el.playbackRate=m.rate}catch(e){}}
    if(P.filt&&P.filtF!==m.lp){P.filtF=m.lp; P.filt.frequency.setTargetAtTime(m.lp,ac.currentTime,.4)} }
  // 再生が拒否されていたら次のタップで再挑戦
  if(BGM.mode&&TRACKS[BGM.mode]&&TRACKS[BGM.mode].retry){} 
}

// 第7版：場面ごとの曲の表情
function bgmMood(){
  if(!S||!S.q||S.scene!=='play') return {rate:1,lp:20000};
  const D=DAYS[S.day], tw=D.tw||{}; let rate=1;
  if(tw.fast) rate+=.05; if(D.trial) rate+=.03; if(S.t<=10&&S.cd<=0) rate=Math.max(rate,1.1);
  return {rate:Math.round(rate*100)/100, lp:tw.rain?1500:tw.moon?5200:20000};
}

function ambTick(){

    const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1600; f.Q.value=.4; const g=ac.createGain(); g.gain.value=0; g.gain.setTargetAtTime(.05*v,now,.6);
