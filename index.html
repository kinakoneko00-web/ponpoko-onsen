/* 落ち葉と湯けむり */
const pc=$('particles'); let px=null, P=[];
function sizeParticles(){const r=devicePixelRatio||1;pc.width=L.w*r;pc.height=L.h*r;px=pc.getContext('2d');px.setTransform(r,0,0,r,0,0)}
function particles(dt){
  if(!px) return;
  px.clearRect(0,0,L.w,L.h);
  if(reduce) return;
  const th=(S&&S.q)?DAYS[S.day].theme:'yu', night=th==='yoru';
  const leaves=P.filter(p=>p.k==='l').length, steam=P.filter(p=>p.k==='s').length;
  const flies=P.filter(p=>p.k==='f').length, birds=P.filter(p=>p.k==='b').length;
  if(night&&flies<12&&Math.random()<.08) P.push({k:'f',x:Math.random()*L.w,y:L.top+L.H-20+Math.random()*60,vx:(Math.random()-.5)*16,vy:(Math.random()-.5)*10,ph:Math.random()*6,life:0,max:4+Math.random()*3});
  if(th==='hiru'&&birds<3&&Math.random()<.006){const dir=Math.random()<.5?1:-1;for(let k=0;k<2+(Math.random()*2|0);k++)P.push({k:'b',x:dir>0?-20-k*16:L.w+20+k*16,y:12+Math.random()*30+k*6,vx:dir*(34+Math.random()*10),ph:Math.random()*6,s:5+Math.random()*2})}
  const saku=deco('sakura');
  if((saku||!night&&th!=='hiru')&&leaves<(saku?18:14)&&Math.random()<.05) P.push({k:'l',x:Math.random()*L.w,y:-10,vx:10+Math.random()*16,vy:18+Math.random()*16,a:Math.random()*6,va:(Math.random()-.5)*3,s:4+Math.random()*3,c:saku?['#ffc3d6','#ff9fbf','#ffe4ee'][Math.random()*3|0]:['#d8432e','#e9772e','#f0b03c'][Math.random()*3|0],ph:Math.random()*6});
  if(steam<10&&Math.random()<.12){const side=Math.random()<.5?-1:1;P.push({k:'s',x:L.cx+side*Math.random()*L.sw*.32,y:L.top-L.roofH-4,vy:-14-Math.random()*8,life:0,max:3+Math.random()*1.5,s:8+Math.random()*6})}
  for(const p of P){
    if(p.k==='l'){p.ph+=dt*2;p.x+=(p.vx+Math.sin(p.ph)*14)*dt;p.y+=p.vy*dt;p.a+=p.va*dt;
      px.save();px.translate(p.x,p.y);px.rotate(p.a);px.fillStyle=p.c;px.beginPath();
      for(let i=0;i<5;i++){const an=i/5*Math.PI*2-Math.PI/2, an2=an+Math.PI/5;px.lineTo(Math.cos(an)*p.s,Math.sin(an)*p.s);px.lineTo(Math.cos(an2)*p.s*.45,Math.sin(an2)*p.s*.45)}
      px.fill();px.restore()}
    else if(p.k==='r'){p.y+=p.vy*dt;p.x-=p.vy*dt*.12;px.strokeStyle='rgba(200,225,255,.7)';px.lineWidth=1.5;px.beginPath();px.moveTo(p.x,p.y);px.lineTo(p.x+p.s*.12,p.y-p.s);px.stroke()}
    else if(p.k==='f'){p.life+=dt;p.ph+=dt*3;p.x+=(p.vx+Math.sin(p.ph)*8)*dt;p.y+=(p.vy+Math.cos(p.ph*1.3)*6)*dt;
      const a=Math.max(0,Math.sin(Math.PI*p.life/p.max))*(.55+.45*Math.sin(p.ph*2.2));
      const gg=px.createRadialGradient(p.x,p.y,0,p.x,p.y,8);gg.addColorStop(0,`rgba(230,255,140,${a})`);gg.addColorStop(1,'rgba(230,255,140,0)');px.fillStyle=gg;px.beginPath();px.arc(p.x,p.y,8,0,7);px.fill();
      px.fillStyle=`rgba(255,255,220,${a})`;px.beginPath();px.arc(p.x,p.y,1.4,0,7);px.fill()}
    else if(p.k==='b'){p.ph+=dt*9;p.x+=p.vx*dt;const f=Math.sin(p.ph)*p.s*.6;
      px.strokeStyle='rgba(40,40,60,.7)';px.lineWidth=1.6;px.beginPath();px.moveTo(p.x-p.s,p.y-f);px.quadraticCurveTo(p.x-p.s*.4,p.y-2,p.x,p.y);px.quadraticCurveTo(p.x+p.s*.4,p.y-2,p.x+p.s,p.y-f);px.stroke()}
    else{p.life+=dt;p.y+=p.vy*dt;p.x+=Math.sin(p.life*2)*6*dt;const a=Math.max(0,.38*Math.sin(Math.PI*p.life/p.max));
      px.fillStyle=`rgba(255,255,255,${a})`;px.beginPath();px.arc(p.x,p.y,p.s+p.life*5,0,7);px.fill()}
  }
  P=P.filter(p=>p.k==='r'?p.y<L.h+10:p.k==='l'?p.y<L.h+20&&p.x<L.w+20:p.k==='b'?p.x>-60&&p.x<L.w+60:p.k==='f'&&!night?false:p.life<p.max);
}

/* タイトルなどの背景：夕暮れの温泉郷 */
function drawScreenBg(){
  const cv=$('bgc'), r=devicePixelRatio||1, w=innerWidth, h=innerHeight;
  cv.width=w*r; cv.height=h*r; const x=cv.getContext('2d'); x.scale(r,r); const R=rng(21);
  let g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,'#2c1d3a'); g.addColorStop(.35,'#7c4a6e'); g.addColorStop(.62,'#f2a777'); g.addColorStop(.8,'#ffd9a8'); g.addColorStop(1,'#3a2216');
  x.fillStyle=g; x.fillRect(0,0,w,h);
  for(let k=0;k<60;k++){x.fillStyle=`rgba(255,250,230,${.2+R()*.6})`;x.fillRect(R()*w,R()*h*.3,R()<.1?2:1,R()<.1?2:1)}
  x.fillStyle='rgba(255,246,214,.9)'; x.beginPath(); x.arc(w*.78,h*.14,Math.min(w,h)*.06,0,7); x.fill();
  g=x.createRadialGradient(w*.78,h*.14,0,w*.78,h*.14,Math.min(w,h)*.3); g.addColorStop(0,'rgba(255,240,200,.35)'); g.addColorStop(1,'rgba(255,240,200,0)'); x.fillStyle=g; x.fillRect(0,0,w,h);
  const ridge=(by,amp,col,seed)=>{const rr=rng(seed);x.fillStyle=col;x.beginPath();x.moveTo(0,h);for(let px=0;px<=w+10;px+=w/30)x.lineTo(px,by-amp*(.5+.5*Math.sin(px/w*6+seed))-rr()*amp*.2);x.lineTo(w,h);x.fill()};
  ridge(h*.6,h*.12,'#6a4a6e',3); ridge(h*.68,h*.09,'#4e3452',8); ridge(h*.76,h*.06,'#3a2440',13);
  // 温泉宿のシルエット
  const bw=Math.min(w*.62,360), bx=w/2-bw/2, by=h*.86, bh=Math.min(h*.2,170);
  x.fillStyle='#24131c';
  x.beginPath();x.moveTo(bx-30,by-bh);x.quadraticCurveTo(w/2,by-bh-46,bx+bw+30,by-bh);x.lineTo(bx+bw,by-bh+10);x.lineTo(bx,by-bh+10);x.closePath();x.fill();
  x.fillRect(bx,by-bh+8,bw,bh);
  const cols=6, rows=3, cw=bw/cols, rh=(bh-14)/rows;
  for(let rr=0;rr<rows;rr++)for(let c=0;c<cols;c++){if(R()<.25)continue;
    x.fillStyle=`rgba(255,${200+R()*30|0},${110+R()*40|0},${.75+R()*.25})`;x.fillRect(bx+c*cw+5,by-bh+14+rr*rh+4,cw-10,rh-10)}
  for(const lx of [bx-14,bx+bw+14]){g=x.createRadialGradient(lx,by-bh+30,0,lx,by-bh+30,30);g.addColorStop(0,'rgba(255,170,90,.8)');g.addColorStop(1,'rgba(255,170,90,0)');x.fillStyle=g;x.fillRect(lx-30,by-bh,60,60);
    x.fillStyle='#e0533f';x.beginPath();x.ellipse(lx,by-bh+30,7,9,0,0,7);x.fill()}
  // 湯けむり
  for(let k=0;k<14;k++){x.fillStyle=`rgba(255,255,255,${.05+R()*.08})`;x.beginPath();x.arc(w/2+(R()-.5)*bw*1.2,by-bh-30-R()*h*.18,20+R()*40,0,7);x.fill()}
  // 手前の杉と地面
  x.fillStyle='#1c0f14';x.fillRect(0,by,w,h-by);
  for(let k=0;k<16;k++){const tx=R()*w;if(Math.abs(tx-w/2)<bw/2+20)continue;const th=h*(.08+R()*.08);x.beginPath();x.moveTo(tx,by-th);x.lineTo(tx+th*.25,by+2);x.lineTo(tx-th*.25,by+2);x.fill()}
  g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(20,10,30,.25)');g.addColorStop(.5,'rgba(20,10,30,0)');g.addColorStop(1,'rgba(20,10,30,.5)');x.fillStyle=g;x.fillRect(0,0,w,h);
}

function coachCheck(now){

  SV.coach=SV.coach||[];

  for(const c of COACH){
    if(SV.coach.includes(c.k)) continue;
    const at=RULES.find(r=>r.k===c.rule)?.at||1;
    if(S.day+1<at) continue;
    if(S.day+1>at+2){SV.coach.push(c.k);save();continue} // もう慣れている面は出さない
    const el=c.find(); if(!el) continue;
    let q;
    if(c.rect){const z=c.rect(); if(!z) continue; q={x:z.x-z.r,y:z.y-z.r,w:z.r*2,h:z.r*2}}

    if(q.x<4||q.y<4||q.x+q.w>sr.width-4||q.y+q.h>sr.height-4) continue;

scr.addEventListener('click',e=>{ if(VN&&!e.target.closest('#sc')){advanceStory()} });
sc.addEventListener('click',e=>{
  initAudio(); ac&&ac.resume&&ac.resume();
  if(e.target.closest('#vn')&&!e.target.closest('[data-go="vnskip"]')){advanceStory();return}
  const so=e.target.closest('[data-story]'); if(so){const st=STORY.find(x=>x.id===so.dataset.story);playStory(st,()=>{S&&S.scene==='result'?showScreen():showMap()});return}
  const km=e.target.closest('[data-kimono]'); if(km&&!km.disabled){SV.kimono=km.dataset.kimono;save();applyKimono();sfx('sel');showAch();return}
  const by=e.target.closest('[data-buy]'); if(by&&!by.disabled){buyShop(by.dataset.buy);return}
  const t=e.target.closest('[data-stage]'); if(t&&!t.disabled){sfx('sel');startStage(+t.dataset.stage);return}
  if(S&&S.scene==='title'&&e.target.closest('.ttl')&&!e.target.closest('[data-go="cfg"]')){titleStart();return}
  const b=e.target.closest('[data-go]'); if(!b) return;
  const g=b.dataset.go;
  if(g==='start'||g==='map'){if(!S||S.scene==='title')S=newGame();showMap();return}
  if(g==='mode'){SV.easy=!SV.easy;save();showMap();return}
  if(g==='cfg'){openSettings();return}
  if(g==='daily'||g==='endless'){if(g==='endless'&&!endlessOpen())return;sfx('sel');startSpecial(g);return}
  if(g==='shop'){sfx('sel');showShop();return}
  if(g==='dex'){sfx('sel');showDex();return}
  if(g==='ach'){sfx('sel');showAch();return}
  if(g==='rule'){nextRule();return}
  if(g==='open'){scr.hidden=true;startDay();setIcons();return}
  if(g==='vnskip'&&VN){clearInterval(VN.timer);const t=VN.then;VN=null;t();return}
});

/* ================= 入力 ================= */
let press=null;
guestsEl.addEventListener('pointerdown',e=>{
  const r=e.target.closest('.req');if(r){e.preventDefault();serve(+r.dataset.id);return}
  let b=e.target.closest('.guest');if(!b||!canAct())return;
  e.preventDefault();
  // 待合のお客は、指にいちばん近いお客をつかむ（となりのお客を間違えて持たないように）
  if(b.classList.contains('queued')){
    const sr=stage.getBoundingClientRect(), px=e.clientX-sr.left, py=e.clientY-sr.top; let best=null,bd=1e9;
    for(const g of (py<L.rowY('B')-2?S.q.A:S.q.B)){const o=els.get(g.id); if(!o) continue; const d=(o.x-px)**2; if(d<bd){bd=d;best=o}}
    if(best) b=best.el;
  }
  b.classList.add('pressed');
  press={id:+b.dataset.id,x:e.clientX,y:e.clientY,el:b,drag:false,ghost:null,pid:e.pointerId};
});
// お客とお客のすき間を押しても、いちばん近い待合のお客をつかむ
stage.addEventListener('pointerdown',e=>{
  if(press||!S||!canAct()||e.target.closest('.guest,.rbtn,.req,.foe,.kickbtn,.tool-btn,.ebtn,.coach')) return;
  const sr=stage.getBoundingClientRect(), px=e.clientX-sr.left, py=e.clientY-sr.top;
  if(py<L.trayTop) return;
  let best=null,bd=1e9;
  for(const g of (py<L.rowY('B')-2?S.q.A:S.q.B)){const o=els.get(g.id); if(!o) continue; const d=(o.x-px)**2; if(d<bd){bd=d;best=o}}
  if(!best||bd>(L.slotW*.75)**2) return;
  e.preventDefault(); best.el.classList.add('pressed');
  press={id:+best.el.dataset.id,x:e.clientX,y:e.clientY,el:best.el,drag:false,ghost:null,pid:e.pointerId};
});
// 指の下が空き部屋でなくても、すぐとなりの空き部屋に吸いつく（狭い部屋でも置きやすく）
function dropRoom(cx,cy){
  const r=stage.getBoundingClientRect(), x=cx-r.left, y=cy-r.top, x0=L.cx-L.sw/2, m=Math.min(40,L.bw*.45);
  if(x<x0-m||x>x0+L.sw+m||y<L.top-m||y>L.top+L.H+m) return -1;
  let best=-1,bd=1e9;
  for(let i=0;i<L.cols*L.fl;i++){ if(S.room[i]||isOff(i)) continue;
    const c=L.cell(i), d=((x-c.x)/L.bw)**2+((y-c.y)/L.bh)**2; if(d<bd){bd=d;best=i} }
  return bd<=1.05?best:-1;
}
function roomAt(cx,cy){
  const r=stage.getBoundingClientRect(), x=cx-r.left, y=cy-r.top, x0=L.cx-L.sw/2;
  const m=Math.min(36,L.bw*.4);
  if(x<x0-m||x>x0+L.sw+m||y<L.top-m||y>L.top+L.H+m) return -1;
  const c=Math.max(0,Math.min(L.cols-1,Math.floor((x-x0)/L.bw))), f=Math.max(0,Math.min(L.fl-1,Math.floor((y-L.top)/L.bh)));
  return f*L.cols+c;
}
addEventListener('pointermove',e=>{
  if(!press||e.pointerId!==press.pid) return;
  const dx=e.clientX-press.x, dy=e.clientY-press.y;
  if(!press.drag&&!S.bmode&&dx*dx+dy*dy>64){
    if(!canAct()){press=null;return}
    const id=press.id;
    if(findQ(id)&&!freeRoom()){nope(id);sfx('nope');hint='full';dirty=true;press=null;return}
    press.drag=true; S.sel=id; dirty=true; sfx('sel');
    const g=document.createElement('div');g.className='ghost';
    const art=press.el.querySelector('.art').cloneNode(true);g.appendChild(art);
    const w=press.el.getBoundingClientRect().width*1.15;g.style.width=w+'px';g.style.height=w+'px';
    document.body.appendChild(g);press.ghost=g;press.w=w;press.el.classList.add('lifted');
  }
  if(press.drag){
    press.ghost.style.transform=`translate(${e.clientX-press.w/2}px,${e.clientY-press.w*.7}px) rotate(${Math.max(-12,Math.min(12,dx*.05))}deg)`;
    const i=dropRoom(e.clientX,e.clientY);
    $('rooms').querySelectorAll('.rbtn').forEach(b=>b.classList.toggle('hover',+b.dataset.r===i));
  }
});
function endPress(e,cancel){
  if(!press||(e&&e.pointerId!==press.pid)) return;
  const p=press; press=null; p.el.classList.remove('pressed');
  if(!p.drag){if(!cancel) tapGuest(p.id); return}
  p.ghost.remove(); p.el.classList.remove('lifted');
  const i=cancel?-1:dropRoom(e.clientX,e.clientY);
  if(i>=0&&S.sel===p.id&&!S.room[i]&&!isOff(i)) tapRoom(i);
  else {S.sel=null;dirty=true}
}
addEventListener('pointerup',e=>endPress(e,false));
addEventListener('pointercancel',e=>endPress(e,true));
guestsEl.addEventListener('keydown',e=>{const r=e.target.closest('.req');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();serve(+r.dataset.id);return}const b=e.target.closest('.guest');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tapGuest(+b.dataset.id)}});
$('rooms').addEventListener('pointerdown',e=>{const b=e.target.closest('.rbtn');if(b){e.preventDefault();tapRoom(+b.dataset.r)}});
$('rooms').addEventListener('keydown',e=>{const b=e.target.closest('.rbtn');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tapRoom(+b.dataset.r)}});
stage.addEventListener('pointerdown',e=>{if(S&&S.sel!=null&&!e.target.closest('.guest,.rbtn,.req,.foe,.kickbtn')){S.sel=null;dirty=true}});
$('rooms').addEventListener('click',e=>{const k=e.target.closest('.kickbtn');if(k)kick(+k.dataset.kick);
  const eb=e.target.closest('.ebtn');if(eb)toggleFusuma(eb.dataset.edge)});
function toggleFusuma(k){
  if(!canAct()) return;
  const i=S.fus.indexOf(k);
  if(i>=0) return; // 置いたふすまは外せない（時間でやぶれる）
  else if(S.fstock>0){S.fus.push(k);S.fusT[k]=FUS_TIME;S.fstock--;S.stat.fusUsed++;sfx('dock');if(S.fstock<=0)S.fmode=false}
  dirty=true;
}
$('fsBtn').addEventListener('click',()=>{if(!canAct())return;S.fmode=!S.fmode;S.bmode=false;S.sel=null;sfx('sel');dirty=true});
$('bkBtn').addEventListener('click',()=>{if(!canAct())return;if(!S.bmode&&S.bstock<=0)return;S.bmode=!S.bmode;S.fmode=false;S.sel=null;sfx('sel');dirty=true});
$('foes').addEventListener('pointerdown',e=>{const b=e.target.closest('.foe');if(b){e.preventDefault();tapFoe(+b.dataset.id)}});
$('spBtn').addEventListener('click',special);
function setPause(p){
  if(!S||S.scene!=='play') return;
  S.paused=p; setIcons();
  stage.querySelector('.paused')?.remove();
  if(p){const d=document.createElement('div');d.className='paused';
    const D=DAYS[S.day];
    d.innerHTML=`<p>ひと休み中</p><div class="pz-rules"><b class="pz-h">この面のルール</b>${typeof hintsHTML==='function'?hintsHTML(D):''}<p class="pz-mis">お題：${MTXT(D.mission)}</p></div><button class="go" data-pz="resume">つづける</button><button class="go sub" data-pz="cfg">⚙ 設定</button><button class="go sub" data-pz="quit">ステージ選択へ</button>`;
    d.addEventListener('click',e=>{const b=e.target.closest('[data-pz]');if(!b)return;sfx('sel');
      if(b.dataset.pz==='resume')setPause(false);
      else if(b.dataset.pz==='cfg')openSettings();
      else{S.paused=false;stage.querySelector('.paused')?.remove();S.tut=null;document.querySelector('.tut')?.remove();S.scene='map';showMap()}});
    stage.appendChild(d)}
}
$('pauseBtn').addEventListener('click',()=>setPause(!S.paused));
$('soundBtn').addEventListener('click',()=>{muted=!muted;initAudio();setIcons()});
document.addEventListener('visibilitychange',()=>{if(document.hidden) setPause(true)});

new ResizeObserver(()=>{
  stage.classList.add('noanim'); layout(); scenery(); sizeParticles();
  if(S&&S.q){dirty=true;frame()} else drawInn();
  requestAnimationFrame(()=>requestAnimationFrame(()=>stage.classList.remove('noanim')));
}).observe(stage);

/* ================= 起動 ================= */
function start(data){
  S=(data&&data.S&&data.S.v===VER)?data.S:newGame();
  if(S.scene==='rule') S.scene='map';
  applyKimono(); layout(); scenery(); sizeParticles(); drawInn(); setIcons(); dirty=true;
  if(S.scene!=='play') showScreen(); else setPause(true);
  requestAnimationFrame(t=>{last=t;requestAnimationFrame(tick)});
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
