# ぽんぽこ温泉宿：Androidアプリを自動で作る
#  - いつも：確認用APK（テスト広告。自分のスマホに入れて試す用）
#  - 署名の鍵（Secrets）があるとき：Google Play に出す AAB（本番の広告ID）
# 広告ID は Settings → Secrets and variables → Actions → Variables に
#   ADMOB_APP_ID / ADMOB_REWARDED_ID / ADMOB_INTERSTITIAL_ID
# 署名の鍵は Secrets に
#   UPLOAD_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
name: Android build

on:
  push:
    branches: [main]
    paths: ['index.html', 'bgm/**', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      # ---- 確認用APK：かならずテスト広告（自分の広告を押すと規約違反になるため）----
      - name: Prepare web files (test ads)
        run: npm run prepare-www
      - name: Create Android project
        run: npx cap add android
      - name: App icon and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1d1630' --iconBackgroundColorDark '#1d1630' --splashBackgroundColor '#1d1630' --splashBackgroundColorDark '#1d1630'
      - name: Patch Android project (test ads)
        run: npm run patch-android
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Inspect APK
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          B=$($AAPT dump badging $APK)
          PKG=$(echo "$B" | grep -o "package: name='[^']*'" | cut -d"'" -f2)
          TSDK=$(echo "$B" | grep -o "targetSdkVersion:'[0-9]*'" | cut -d"'" -f2)
          VC=$(echo "$B" | grep -o "versionCode='[0-9]*'" | cut -d"'" -f2)
          LABEL=$(echo "$B" | grep -o "application-label:'[^']*'" | cut -d"'" -f2)
          M=$($AAPT dump xmltree $APK --file AndroidManifest.xml)
          ADS=$(echo "$M" | grep -c "com.google.android.gms.ads.APPLICATION_ID" || true)
          PORT=$(echo "$M" | grep -c "screenOrientation" || true)
          ADID=$(echo "$M" | grep -c "com.google.android.gms.permission.AD_ID" || true)
          SIZE=$(du -k $APK | cut -f1)
          echo "::notice title=APK::package=$PKG label=$LABEL targetSdk=$TSDK versionCode=$VC admobAppId=$ADS portrait=$PORT adIdPermission=$ADID sizeKB=$SIZE"
      - uses: actions/upload-artifact@v6
        with:
          name: ponpoko-debug-apk-${{ github.run_number }}
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # ---- Google Play 用 AAB：署名の鍵があるときだけ ----
      - name: Check signing key
        id: key
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
            echo "has=1" >> "$GITHUB_OUTPUT"
          else
            echo "署名の鍵が未設定なので AAB は作りません（確認用APKだけ）"
          fi
      - name: Prepare release (real ad IDs)
        if: steps.key.outputs.has == '1'
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
        run: |
          npm run prepare-www
          npm run patch-android
          npx cap sync android
      - name: Build release AAB
        if: steps.key.outputs.has == '1'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v6
        if: steps.key.outputs.has == '1'
        with:
          name: ponpoko-release-aab-${{ github.run_number }}
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
